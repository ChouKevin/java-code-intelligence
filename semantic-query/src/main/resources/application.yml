spring:
  jackson:
    default-property-inclusion: non_absent
    deserialization:
      fail-on-unknown-properties: true
  ai:
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        type: SYNC
        stdio: false
        tool-callback-converter: false
        annotation-scanner:
          enabled: false
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

semantic:
  query:
    api-token: ${SEMANTIC_QUERY_API_TOKEN:}
    source:
      published-root: ${SEMANTIC_SOURCE_PUBLISHED_ROOT:/data/source-published}
      rg-executable: ${SEMANTIC_QUERY_RG_EXECUTABLE:/usr/bin/rg}
      allowed-repositories: []
      read-content-bytes: 65536
      search-timeout: 5s
      read-timeout: 2s
      list-timeout: 2s
      max-active-searches: 2
