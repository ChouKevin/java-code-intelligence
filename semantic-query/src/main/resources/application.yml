spring:
  jackson:
    default-property-inclusion: non_absent
  mongodb:
    uri: ${SEMANTIC_MONGODB_URI:mongodb://localhost:27017/semantic?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000&socketTimeoutMS=2000}
  ai:
    mcp:
      server:
        enabled: true
        protocol: STATELESS
        type: SYNC
        stdio: false
        tool-callback-converter: false
        annotation-scanner:
          enabled: false
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

management:
  health:
    mongodb:
      enabled: false

semantic:
  query:
    api-token: ${SEMANTIC_QUERY_API_TOKEN:}
    storage-timeout: ${SEMANTIC_QUERY_STORAGE_TIMEOUT:2s}
    read-policy:
      forbidden-repositories: []
      forbidden-packages: []
      forbidden-classes: []
      forbidden-methods: []
