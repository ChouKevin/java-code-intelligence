    InternalProgramElement:
      type: object
      additionalProperties: false
      required: [factId, kind, displayName, source]
      properties:
        factId: {$ref: '#/components/schemas/FactId'}
        kind: {type: string, enum: [TYPE, METHOD, FIELD, ENUM_CONSTANT, RECORD_COMPONENT, MAPPER_STATEMENT, ANNOTATION_USAGE, TYPE_USAGE, SQL_IDENTIFIER, CONFIGURATION_KEY, OUTBOUND_API, MQ_PUBLISHER, ERROR_CONTRACT, API_ROUTE, MQ_DESTINATION, SCHEDULE]}
        displayName: {type: string, minLength: 1}
        source: {$ref: '#/components/schemas/SourceSnippet'}
    ExternalCallee:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: {type: string, minLength: 1}
    RelationSite:
      type: object
      additionalProperties: false
      required: [factId, source]
      properties:
        factId: {$ref: '#/components/schemas/FactId'}
        source: {$ref: '#/components/schemas/SourceSnippet'}
    Trigger:
      type: object
      additionalProperties: false
      required: [kind, method, value]
      properties:
        kind: {type: string, minLength: 1}
        method: {type: string}
        value: {type: string, minLength: 1}
    EntryPointItem:
