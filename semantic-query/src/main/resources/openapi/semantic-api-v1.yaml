  "components": {
    "securitySchemes": {
      "QueryToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Api-Token"
      }
    },
    "schemas": {
      "SourceContext": {
        "type": "object",
        "properties": {
          "repositoryId": {
            "type": "string",
            "minLength": 1
          },
          "revision": {
            "type": "string",
            "pattern": "^[a-f0-9]{40}$"
          }
        },
        "required": [
          "repositoryId",
          "revision"
        ],
        "additionalProperties": false
      },
      "Page": {
        "type": "object",
        "properties": {
          "returned": {
            "type": "integer",
            "minimum": 0
          },
          "hasMore": {
            "type": "boolean"
          },
          "nextCursor": {
            "anyOf": [
              {
                "type": "string",
                "minLength": 1
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "returned",
          "hasMore"
        ],
        "additionalProperties": false
      },
      "GuideInfo": {
        "type": "object",
        "properties": {
          "state": {
            "type": "string",
            "enum": [
              "AVAILABLE",
              "MISSING",
              "INVALID",
              "DISABLED"
            ]
          },
          "path": {
            "anyOf": [
              {
                "type": "string",
                "minLength": 1
              },
              {
                "type": "null"
              }
            ]
          },
          "digest": {
            "anyOf": [
              {
                "type": "string",
                "minLength": 1
              },
              {
                "type": "null"
              }
            ]
          },
          "freshness": {
            "type": "string",
            "enum": [
              "NOT_VERIFIED"
            ]
          }
        },
        "required": [
          "state",
          "freshness"
        ],
        "additionalProperties": false
      },
      "Coverage": {
        "type": "object",
        "properties": {
          "readableFileCount": {
            "type": "integer",
            "minimum": 0
          },
          "excludedFileCount": {
            "type": "integer",
            "minimum": 0
          },
          "unsupportedCounts": {
            "type": "object",
            "additionalProperties": {
              "type": "integer",
              "minimum": 0
            }
          }
        },
        "required": [
          "readableFileCount",
          "excludedFileCount",
          "unsupportedCounts"
        ],
        "additionalProperties": false
      },
      "RepositoryCollection": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "repositoryId": {
                  "type": "string",
                  "minLength": 1
                },
                "displayName": {
                  "type": "string",
                  "minLength": 1
                },
                "defaultBranch": {
                  "type": "string",
                  "minLength": 1
                },
                "projectGuidePath": {
                  "anyOf": [
                    {
                      "type": "string",
                      "minLength": 1
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "sourceStatus": {
                  "type": "string",
                  "enum": [
                    "NOT_PREPARED",
                    "PREPARING",
                    "FAILED",
                    "READY"
                  ]
                },
                "semanticStatus": {
                  "type": "string",
                  "enum": [
                    "NOT_READY"
                  ]
                },
                "revision": {
                  "anyOf": [
                    {
                      "type": "string",
                      "pattern": "^[a-f0-9]{40}$"
                    },
                    {
                      "type": "null"
                    }
                  ]
                }
              },
              "required": [
                "repositoryId",
                "displayName",
                "defaultBranch",
                "sourceStatus",
                "semanticStatus"
              ],
              "additionalProperties": false
            }
          },
          "page": {
            "$ref": "#/components/schemas/Page"
          }
        },
        "required": [
          "items",
          "page"
        ],
        "additionalProperties": false
      },
      "ContextResult": {
        "type": "object",
        "properties": {
          "repositoryId": {
            "type": "string",
            "minLength": 1
          },
          "defaultBranch": {
            "type": "string",
            "minLength": 1
          },
          "sourceStatus": {
            "type": "string",
            "enum": [
              "NOT_PREPARED",
              "PREPARING",
              "FAILED",
              "READY"
            ]
          },
          "semanticStatus": {
            "type": "string",
            "enum": [
              "NOT_READY"
            ]
          },
          "context": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/SourceContext"
              },
              {
                "type": "null"
              }
            ]
          },
          "projectGuide": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/GuideInfo"
              },
              {
                "type": "null"
              }
            ]
          },
          "coverage": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Coverage"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "repositoryId",
          "defaultBranch",
          "sourceStatus",
          "semanticStatus"
        ],
        "additionalProperties": false
      },
      "FileCollection": {
        "type": "object",
        "properties": {
          "context": {
            "$ref": "#/components/schemas/SourceContext"
          },
          "items": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "path": {
                  "type": "string",
                  "minLength": 1
                },
                "kind": {
                  "type": "string",
                  "enum": [
                    "DIRECTORY",
                    "FILE"
                  ]
                },
                "status": {
                  "anyOf": [
                    {
                      "type": "string",
                      "enum": [
                        "TEXT",
                        "BINARY",
                        "UNSUPPORTED_ENCODING",
                        "UNSUPPORTED_PATH",
                        "SYMLINK",
                        "SUBMODULE",
                        "LFS_POINTER"
                      ]
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "byteLength": {
                  "anyOf": [
                    {
                      "type": "integer",
                      "minimum": 0
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "navigationHint": {
                  "type": "boolean"
                }
              },
              "required": [
                "path",
                "kind",
                "navigationHint"
              ],
              "additionalProperties": false
            }
          },
          "page": {
            "$ref": "#/components/schemas/Page"
          }
        },
        "required": [
          "context",
          "items",
          "page"
        ],
        "additionalProperties": false
      },
      "TextSearchResult": {
        "type": "object",
        "properties": {
          "context": {
            "$ref": "#/components/schemas/SourceContext"
          },
          "matches": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "path": {
                  "type": "string",
                  "minLength": 1
                },
                "line": {
                  "type": "integer",
                  "minimum": 1
                },
                "column": {
                  "type": "integer",
                  "minimum": 1
                },
                "matchedText": {
                  "type": "string"
                },
                "navigationHint": {
                  "type": "boolean"
                }
              },
              "required": [
                "path",
                "line",
                "column",
                "matchedText",
                "navigationHint"
              ],
              "additionalProperties": false
            }
          },
          "truncated": {
            "type": "boolean"
          },
          "scanComplete": {
            "type": "boolean"
          }
        },
        "required": [
          "context",
          "matches",
          "truncated",
          "scanComplete"
        ],
        "additionalProperties": false
      },
      "SourceResult": {
        "type": "object",
        "properties": {
          "context": {
            "$ref": "#/components/schemas/SourceContext"
          },
          "path": {
            "type": "string",
            "minLength": 1
          },
          "startLine": {
            "type": "integer",
            "minimum": 1
          },
          "endLine": {
            "anyOf": [
              {
                "type": "integer",
                "minimum": 1
              },
              {
                "type": "null"
              }
            ]
          },
          "content": {
            "type": "string"
          },
          "hasMore": {
            "type": "boolean"
          },
          "nextCursor": {
            "anyOf": [
              {
                "type": "string",
                "minLength": 1
              },
              {
                "type": "null"
              }
            ]
          },
          "startsMidLine": {
            "type": "boolean"
          },
          "endsMidLine": {
            "type": "boolean"
          },
          "navigationHint": {
            "type": "boolean"
          }
        },
        "required": [
          "context",
          "path",
          "startLine",
          "content",
          "hasMore",
          "startsMidLine",
          "endsMidLine",
          "navigationHint"
        ],
        "additionalProperties": false
      },
      "ContextRequest": {
        "type": "object",
        "properties": {
          "repositoryId": {
            "type": "string",
            "minLength": 1
          },
          "revision": {
            "type": "string",
            "pattern": "^[a-f0-9]{40}$"
          }
        },
        "required": [
          "repositoryId"
        ],
        "additionalProperties": false
      },
      "FileListRequest": {
        "type": "object",
        "properties": {
          "context": {
            "$ref": "#/components/schemas/SourceContext"
          },
          "directory": {
            "type": "string"
          },
          "limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100,
            "default": 20
          },
          "cursor": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "context"
        ],
        "additionalProperties": false
      },
      "TextSearchRequest": {
        "type": "object",
        "properties": {
          "context": {
            "$ref": "#/components/schemas/SourceContext"
          },
          "query": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512,
            "description": "At most 256 Unicode code points, literal case-sensitive and single-line."
          },
          "directory": {
            "type": "string"
          },
          "filePattern": {
            "type": "string",
            "minLength": 1
          },
          "limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100,
            "default": 20
          }
        },
        "required": [
          "context",
          "query"
        ],
        "additionalProperties": false
      },
      "ReadSourceRequest": {
        "type": "object",
        "properties": {
          "context": {
            "$ref": "#/components/schemas/SourceContext"
          },
          "path": {
            "type": "string",
