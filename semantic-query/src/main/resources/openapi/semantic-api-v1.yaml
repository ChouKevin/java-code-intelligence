{
  "openapi": "3.1.0",
  "info": {
    "title": "Published source Query API",
    "version": "1.0.0",
    "description": "Five source-only operations, exact repositoryId plus 40-character lowercase SHA revision. Query reads only published membership and immutable source; guides remain NOT_VERIFIED. Default page size 20, read 200 lines / 65536 content bytes, serialized read response ≤524288 bytes."
  },
  "security": [
    {
      "QueryToken": []
    }
  ],
  "paths": {
    "/api/v1/repositories": {
      "get": {
        "operationId": "list_repositories",
        "summary": "Read only published source; never invoke Indexer.",
        "responses": {
          "200": {
            "description": "Same application result as MCP structuredContent and JSON text content.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RepositoryCollection"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "401": {
            "description": "Query token required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/QuerySecurityError"
                }
              }
            }
          },
          "403": {
            "description": "Query access disabled",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/QuerySecurityError"
                }
              }
            }
          },
          "404": {
            "description": "Repository, revision or source not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "409": {
            "description": "Source not prepared",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "422": {
            "description": "Unsupported source",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "503": {
            "description": "Source busy or unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "504": {
            "description": "Source operation timed out",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "nameFilter",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ]
      }
    },
