,
      "/api/v1/relations": {
        "post": {
          "operationId": "find_relations",
          "summary": "Read exact-generation static relations and framework candidates.",
          "description": "Mandatory context and indexGeneration; never follows latest. Relation enums are case-sensitive uppercase: direction INCOMING or OUTGOING. FILE requires OUTGOING; EXTERNAL_TARGET requires INCOMING. Incoming is exact target identity, not unresolved name matching. Preserve all filters and limit on continuation. Scope tags distinguish lambda/initializer provenance. Empty results and missing coverage do not prove no callers; verify raw source. Correct INVALID_ARGUMENT fields against the schema with the same exact pins; never blindly repeat unchanged failures, prepare, remove pins or switch current implicitly. Complete response 163840 bytes; MCP 524288 bytes.",
          "requestBody": {
            "required": true,
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/FindRelationsRequest"
                }
              }
            }
          },
          "responses": {
            "200": {
              "description": "Whole static facts with exact provenance; same result as MCP.",
              "content": {
                "application/json": {
                  "schema": {
                    "$ref": "#/components/schemas/RelationResult"
                  }
                }
              }
            },
            "400": {
              "description": "Invalid tagged anchor, direction, filters, limit or cursor.",
              "content": {
                "application/json": {
                  "schema": {
                    "$ref": "#/components/schemas/SemanticQueryError"
                  }
                }
              }
            },
            "401": {
              "description": "Query token required.",
              "content": {
                "application/json": {
                  "schema": {
                    "$ref": "#/components/schemas/QuerySecurityError"
                  }
                }
              }
            },
            "403": {
              "description": "Query disabled.",
              "content": {
                "application/json": {
                  "schema": {
                    "$ref": "#/components/schemas/QuerySecurityError"
                  }
                }
              }
            },
            "404": {
              "description": "Exact generation expired or anchor not found (INDEX_SYMBOL_NOT_FOUND).",
              "content": {
                "application/json": {
                  "schema": {
                    "$ref": "#/components/schemas/SemanticQueryError"
                  }
                }
              }
            },
            "409": {
              "description": "Known generation lacks Relations (INDEX_CAPABILITY_UNAVAILABLE).",
              "content": {
                "application/json": {
                  "schema": {
                    "$ref": "#/components/schemas/SemanticQueryError"
                  }
                }
              }
            },
            "413": {
              "description": "Whole row or metadata exceeds result budget.",
              "content": {
                "application/json": {
                  "schema": {
                    "$ref": "#/components/schemas/SemanticQueryError"
                  }
                }
              }
            },
            "503": {
              "description": "Index unavailable or shared search permits busy.",
              "content": {
                "application/json": {
                  "schema": {
                    "$ref": "#/components/schemas/SemanticQueryError"
                  }
                }
              }
            },
            "504": {
              "description": "Five-second index deadline exceeded.",
              "content": {
                "application/json": {
                  "schema": {
                    "$ref": "#/components/schemas/SemanticQueryError"
                  }
                }
              }
            }
          }
        }
      }
