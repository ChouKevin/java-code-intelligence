        "type": "object",
        "properties": {
          "code": { "type": "string", "pattern": "^[A-Z][A-Z0-9_]{0,63}$", "description": "Bounded safe diagnostic code; parser raw messages are not exposed." },
          "range": { "anyOf": [{ "$ref": "#/components/schemas/SourceSpan" }, { "type": "null" }], "description": "Optional original-source range." }
        },
        "required": ["code"],
        "additionalProperties": false
      },
      "FileOutcome": {
        "type": "object",
        "description": "Inventory and parse status for an existing outline target.",
        "properties": {
          "path": { "type": "string", "minLength": 1, "description": "Repository-relative file path." },
          "javaFile": { "type": "boolean", "description": "True when the case-sensitive path ends in .java." },
          "status": { "type": "string", "enum": ["PARSED", "PARSE_FAILED", "UNSUPPORTED", "TOO_LARGE"], "description": "Explicit syntax parse outcome." },
          "byteLength": { "type": "integer", "minimum": 0, "description": "Original source byte length." },
          "blobId": { "anyOf": [{ "type": "string", "pattern": "^[a-f0-9]{40}$" }, { "type": "null" }], "description": "Optional Git blob SHA-1." },
          "contentDigest": { "anyOf": [{ "type": "string", "pattern": "^[a-f0-9]{64}$" }, { "type": "null" }], "description": "Optional SHA-256 of original source bytes." },
          "diagnostics": { "type": "array", "maxItems": 100, "items": { "$ref": "#/components/schemas/IndexDiagnostic" }, "description": "At most 100 safe diagnostic codes and bounded source ranges." }
        },
        "required": ["path", "javaFile", "status", "byteLength", "diagnostics"],
        "additionalProperties": false
      },
      "Declaration": {
        "type": "object",
        "description": "Java declaration syntax evidence; not a resolved symbol or runtime conclusion.",
        "properties": {
          "symbolId": { "type": "string", "pattern": "^[a-f0-9]{64}$", "description": "Lowercase SHA-256 declaration identity scoped to this generation." },
          "name": { "type": "string", "description": "Recorded Java identifier without normalization or case folding." },
          "kind": { "type": "string", "enum": ["CLASS", "INTERFACE", "RECORD", "ENUM", "ANNOTATION_TYPE", "METHOD", "CONSTRUCTOR", "FIELD", "RECORD_COMPONENT", "ENUM_CONSTANT", "ANNOTATION_MEMBER"], "description": "Exact declaration kind." },
          "owner": { "type": "string", "description": "Lexical owner label; not resolved type identity." },
          "parentSymbolId": { "anyOf": [{ "type": "string", "pattern": "^[a-f0-9]{64}$" }, { "type": "null" }], "description": "Optional nearest indexed enclosing declaration identity." },
          "path": { "type": "string", "minLength": 1, "description": "Repository-relative source path." },
          "blobId": { "type": "string", "pattern": "^[a-f0-9]{40}$", "description": "Git blob SHA-1 for original source bytes." },
          "contentDigest": { "type": "string", "pattern": "^[a-f0-9]{64}$", "description": "SHA-256 of original source bytes." },
          "byteLength": { "type": "integer", "minimum": 0, "maximum": 1048576, "description": "Source file length in bytes; indexed Java input is at most 1,048,576 bytes." },
          "range": { "$ref": "#/components/schemas/SourceSpan", "description": "Declaration range in original source bytes and LF lines." },
          "nameRange": { "$ref": "#/components/schemas/SourceSpan", "description": "Identifier range in original source bytes and LF lines." },
          "signature": { "type": "string", "description": "Written syntax signature; no type resolution is implied." }
        },
        "required": ["symbolId", "name", "kind", "owner", "path", "blobId", "contentDigest", "byteLength", "range", "nameRange", "signature"],
        "additionalProperties": false
      },
      "Evidence": {
        "type": "object",
        "description": "Syntax-only candidate provenance; unresolved expressions remain explicitly unresolved.",
        "properties": {
          "kind": { "type": "string", "enum": ["MAIN_SIGNATURE", "FULLY_QUALIFIED", "DIRECT_IMPORT", "AMBIGUOUS_SIMPLE"], "description": "Evidence classification." },
          "annotation": { "anyOf": [{ "type": "string" }, { "type": "null" }], "description": "Optional exact annotation spelling; absent for main-signature evidence." },
          "literalValues": { "type": "object", "additionalProperties": { "type": "array", "items": { "type": "string" } }, "description": "Annotation member values recognized as literals only." },
          "unresolvedMembers": { "type": "array", "items": { "type": "string", "minLength": 1 }, "description": "Annotation members whose values are expressions rather than recognized literals." },
          "range": { "$ref": "#/components/schemas/SourceSpan", "description": "Evidence range in original source bytes and LF lines." }
        },
        "required": ["kind", "literalValues", "unresolvedMembers", "range"],
        "additionalProperties": false
      },
      "EntryCandidate": {
        "type": "object",
        "description": "Syntax-recognized candidate, not a confirmed runtime endpoint.",
        "properties": {
          "candidateId": { "type": "string", "pattern": "^[a-f0-9]{64}$", "description": "Lowercase SHA-256 candidate identity scoped to this generation." },
          "kind": { "type": "string", "enum": ["MAIN", "HTTP_MAPPING", "SCHEDULED", "RABBIT_LISTENER"], "description": "Recognized candidate family." },
          "declaration": { "$ref": "#/components/schemas/Declaration", "description": "Declaration associated with this candidate." },
          "evidence": { "$ref": "#/components/schemas/Evidence", "description": "Syntax provenance and uncertainty." }
        },
        "required": ["candidateId", "kind", "declaration", "evidence"],
        "additionalProperties": false
      },
      "IndexDeclarationResult": {
        "type": "object",
        "description": "Bounded declaration result for search_code or get_outline.",
        "properties": {
          "context": { "$ref": "#/components/schemas/SourceContext", "description": "Exact source identity searched." },
          "indexGeneration": { "type": "string", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", "description": "Immutable index generation used for this result." },
          "profile": { "$ref": "#/components/schemas/IndexProfile", "description": "Parser and schema provenance." },
          "capabilities": { "$ref": "#/components/schemas/IndexCapabilities" },
          "coverage": { "$ref": "#/components/schemas/IndexCoverage", "description": "Independent Java-file coverage; partial coverage does not prove absence." },
          "analysisLevel": { "type": "string", "enum": ["SYNTAX"], "description": "Syntax-only analysis; no type resolution or runtime conclusion." },
          "items": { "type": "array", "items": { "$ref": "#/components/schemas/Declaration" }, "description": "Complete declaration rows in the documented stable order." },
          "page": { "$ref": "#/components/schemas/Page", "description": "Returned count and generation/filter-bound continuation state." },
          "file": { "anyOf": [{ "$ref": "#/components/schemas/FileOutcome" }, { "type": "null" }], "description": "Optional outline file status and safe diagnostics; absent/null for search_code." }
        },
        "required": ["context", "indexGeneration", "profile", "capabilities", "coverage", "analysisLevel", "items", "page"],
        "additionalProperties": false
      },
      "IndexEntryPointResult": {
        "type": "object",
        "description": "Bounded syntax-recognized entry-candidate result.",
        "properties": {
          "context": { "$ref": "#/components/schemas/SourceContext", "description": "Exact source identity searched." },
          "indexGeneration": { "type": "string", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", "description": "Immutable index generation used for this result." },
          "profile": { "$ref": "#/components/schemas/IndexProfile", "description": "Parser and schema provenance." },
          "capabilities": { "$ref": "#/components/schemas/IndexCapabilities" },
          "coverage": { "$ref": "#/components/schemas/IndexCoverage", "description": "Independent Java-file coverage; partial coverage does not prove absence." },
          "analysisLevel": { "type": "string", "enum": ["SYNTAX"], "description": "Syntax-only analysis; candidates are not confirmed runtime endpoints." },
          "items": { "type": "array", "items": { "$ref": "#/components/schemas/EntryCandidate" }, "description": "Syntax candidates in stable source order." },
          "page": { "$ref": "#/components/schemas/Page", "description": "Returned count and generation/filter-bound continuation state." },
          "file": { "anyOf": [{ "$ref": "#/components/schemas/FileOutcome" }, { "type": "null" }], "description": "Optional outline file status; null for entry-point listing." }
        },
        "required": ["context", "indexGeneration", "profile", "capabilities", "coverage", "analysisLevel", "items", "page"],
        "additionalProperties": false
      },
      "SemanticQueryError": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "INVALID_ARGUMENT",
              "REPOSITORY_NOT_FOUND",
              "SOURCE_NOT_PREPARED",
              "REVISION_NOT_PREPARED",
              "SOURCE_NOT_FOUND",
              "SOURCE_UNSUPPORTED",
              "SOURCE_SUMMARY_UNAVAILABLE",
              "SOURCE_RESULT_TOO_LARGE",
              "SOURCE_BUSY",
              "SOURCE_UNAVAILABLE",
              "SOURCE_TIMEOUT",
              "INDEX_NOT_PREPARED",
              "INDEX_UNAVAILABLE",
              "INDEX_INCOMPATIBLE",
              "INDEX_GENERATION_EXPIRED",
              "INDEX_RESULT_TOO_LARGE",
              "INDEX_BUSY",
              "INDEX_CAPABILITY_UNAVAILABLE",
              "INDEX_SYMBOL_NOT_FOUND",
              "INDEX_TIMEOUT"
            ],
            "description": "Stable safe domain or request error code."
          },
          "message": {
            "type": "string",
            "description": "Fixed safe recovery advice; raw causes and echoed arguments are not exposed."
          },
          "reason": { "type": "string", "enum": ["NOT_REQUESTED", "ELIDED", "NO_ELISION", "BELOW_SUMMARY_THRESHOLD", "UNSUPPORTED_LANGUAGE", "INDEX_NOT_READY", "INDEX_UNAVAILABLE", "FOLD_METADATA_UNAVAILABLE", "FILE_PARSE_FAILED", "FILE_UNSUPPORTED", "FILE_TOO_LARGE"], "description": "Optional bounded safe reason for SOURCE_SUMMARY_UNAVAILABLE; never contains internal diagnostics." }
        },
        "required": [
          "code",
          "message"
        ],
        "additionalProperties": false
      },
      "QuerySecurityError": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "QUERY_TOKEN_REQUIRED",
              "QUERY_ACCESS_DISABLED"
            ]
          },
          "retryable": {
            "type": "boolean"
          }
        },
        "required": [
          "code",
          "retryable"
        ],
        "additionalProperties": false
      }
    }
  }
}
