        repositoryId: {$ref: '#/components/schemas/RepositoryId'}
        reviewId: {$ref: '#/components/schemas/ReviewId'}
        side: {$ref: '#/components/schemas/ReviewSide'}
        revision: {$ref: '#/components/schemas/Revision'}
        kinds: {$ref: '#/components/schemas/EntryPointRequest/properties/kinds'}
        offset: {type: integer, minimum: 0, default: 0}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
    ReviewApiRouteRequest:
      type: object
      additionalProperties: false
      required: [repositoryId, reviewId, side, revision, httpMethod, path]
