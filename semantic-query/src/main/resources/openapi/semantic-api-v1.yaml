        issueCodes: {type: array, items: {type: string}}
    EntryPointCollectionResult:
      type: object
      additionalProperties: false
      required: [repositoryId, revision, items, page]
      properties:
        repositoryId: {$ref: '#/components/schemas/RepositoryId'}
        revision: {$ref: '#/components/schemas/Revision'}
        items: {type: array, items: {$ref: '#/components/schemas/EntryPointItem'}}
        page: {$ref: '#/components/schemas/Page'}
    EventListenerCollectionResult:
