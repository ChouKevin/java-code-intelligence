    ImplementationItem:
      type: object
      additionalProperties: false
      required: [implementation, relationKind]
      properties:
        implementation: {$ref: '#/components/schemas/InternalProgramElement'}
        relationKind: {type: string, enum: [IMPLEMENTS, OVERRIDES]}
    CallerItem:
      type: object
      additionalProperties: false
      required: [caller, callSite]
      properties:
        caller: {$ref: '#/components/schemas/InternalProgramElement'}
        callSite: {$ref: '#/components/schemas/RelationSite'}
    CalleeItem:
      type: object
      additionalProperties: false
      required: [callee, callSite, resolutionStatus]
      properties:
        callee:
          oneOf:
            - {$ref: '#/components/schemas/InternalProgramElement'}
            - {$ref: '#/components/schemas/ExternalCallee'}
        callSite: {$ref: '#/components/schemas/RelationSite'}
        resolutionStatus: {type: string, enum: [INDEXED, UNINDEXED_TARGET, UNRESOLVED]}
    ReferenceItem:
