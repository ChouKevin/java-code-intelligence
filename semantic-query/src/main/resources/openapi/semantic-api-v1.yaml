        readableTextCount: {type: integer, minimum: 0}
        binaryCount: {type: integer, minimum: 0}
        unsupportedEncodingCount: {type: integer, minimum: 0}
        tooLargeCount: {type: integer, minimum: 0}
        symlinkCount: {type: integer, minimum: 0}
        submoduleCount: {type: integer, minimum: 0}
        lfsPointerCount: {type: integer, minimum: 0}
        unsupportedPathCount: {type: integer, minimum: 0}
    GitFileCollection:
      type: object
      additionalProperties: false
      required: [repositoryId, snapshotId, revision, items, page, coverage]
      properties:
        repositoryId: {$ref: '#/components/schemas/RepositoryId'}
        snapshotId: {$ref: '#/components/schemas/GitEvidenceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        items: {type: array, items: {$ref: '#/components/schemas/GitFileItem'}}
        page: {$ref: '#/components/schemas/Page'}
        coverage: {$ref: '#/components/schemas/GitSnapshotCoverage'}
    GitFileContent:
      type: object
      additionalProperties: false
      required: [repositoryId, snapshotId, revision, path, pathKey, contentStatus, content, startLine, endLine, startLineComplete, endLineComplete]
      properties:
        repositoryId: {$ref: '#/components/schemas/RepositoryId'}
        snapshotId: {$ref: '#/components/schemas/GitEvidenceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        path: {type: string}
        pathKey: {type: string}
        contentStatus: {type: string}
        content: {type: string}
        startLine: {type: integer, minimum: 0}
        endLine: {type: integer, minimum: 0}
        startLineComplete: {type: boolean}
        endLineComplete: {type: boolean}
        nextCursor: {type: string}
    GitTextMatch:
      type: object
      additionalProperties: false
      required: [path, pathKey, line, column, snippet, snippetTruncated]
      properties:
        path: {type: string}
        pathKey: {type: string}
        line: {type: integer, minimum: 1}
        column: {type: integer, minimum: 1}
        snippet: {type: string}
        snippetTruncated: {type: boolean}
    GitTextSearchResult:
      type: object
      additionalProperties: false
      required: [repositoryId, snapshotId, revision, items, scanComplete, coverage]
      properties:
        repositoryId: {$ref: '#/components/schemas/RepositoryId'}
        snapshotId: {$ref: '#/components/schemas/GitEvidenceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        items: {type: array, items: {$ref: '#/components/schemas/GitTextMatch'}}
        scanComplete: {type: boolean}
        nextCursor: {type: string}
        coverage: {$ref: '#/components/schemas/GitSnapshotCoverage'}
    Page:
