        catalogId: {$ref: '#/components/schemas/GitEvidenceId'}
        observedAt: {type: string, format: date-time}
        items: {type: array, items: {$ref: '#/components/schemas/GitBranchItem'}}
        page: {$ref: '#/components/schemas/Page'}
    GitCommitItem:
      type: object
      additionalProperties: false
      required: [revision, parents, subject, committedAt]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        parents: {type: array, items: {$ref: '#/components/schemas/Revision'}}
        subject: {type: string}
        committedAt: {type: string, format: date-time}
    GitCommitCollection:
      type: object
      additionalProperties: false
      required: [repositoryId, historyId, revision, preparedAt, items, page]
      properties:
        repositoryId: {$ref: '#/components/schemas/RepositoryId'}
        historyId: {$ref: '#/components/schemas/GitEvidenceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        preparedAt: {type: string, format: date-time}
        items: {type: array, items: {$ref: '#/components/schemas/GitCommitItem'}}
        page: {$ref: '#/components/schemas/Page'}
    GitComparisonRequest:
      type: object
      additionalProperties: false
      required: [repositoryId, comparisonId, previous, current]
      properties:
        repositoryId: {$ref: '#/components/schemas/RepositoryId'}
        comparisonId: {type: string, format: uuid}
        previous: {$ref: '#/components/schemas/Revision'}
        current: {$ref: '#/components/schemas/Revision'}
        offset: {type: integer, minimum: 0, default: 0}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
    GitFileDiffRequest:
      type: object
      additionalProperties: false
      required: [repositoryId, comparisonId, previous, current, changeId]
      properties:
