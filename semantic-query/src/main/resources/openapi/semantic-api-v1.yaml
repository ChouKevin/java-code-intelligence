{
  "openapi": "3.1.0",
  "info": {
    "title": "Semantic Query read-only API",
    "version": "1.0.0",
    "description": "Thirteen operations shared with Query MCP. Strict shared binding rejects unknown fields and incompatible unions. Current exact SHA can expire; READY reviews stay immutable. Query reads Mongo only and never prepares evidence. Optional absent evidence fields are omitted, not fake values."
  },
  "security": [
    {
      "QueryToken": []
    }
  ],
  "paths": {
    "/api/v1/repositories": {
      "get": {
        "operationId": "list_repositories",
        "summary": "Configured visible discovery includes unindexed repositories.",
        "responses": {
          "200": {
            "description": "Application result, equal to MCP structuredContent and serialized TextContent.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RepositoryCollection"
                }
              }
            }
          },
          "400": {
            "description": "INVALID_ARGUMENT or FACT_KIND_MISMATCH",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "404": {
            "description": "Unknown or denied repository/fact/review/evidence",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "409": {
            "description": "Revision outdated, immutable context mismatch, review unavailable or metadata not prepared",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "503": {
            "description": "Storage unavailable; no driver diagnostics",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "401": {
            "description": "Query token required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/QuerySecurityError"
                }
              }
            }
          },
          "403": {
            "description": "Query access disabled",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/QuerySecurityError"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "nameFilter",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "description": "Literal case-sensitive substring of repositoryId or displayName."
            },
            "description": "Same field as MCP nameFilter"
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1
            },
            "description": "Same field as MCP cursor"
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            },
            "description": "Same field as MCP limit"
          }
        ]
      }
    },
