    SourceSnippet:
      type: object
      additionalProperties: false
      required: [path, startLine, endLine, code]
      properties:
        path: {type: string}
        startLine: {type: integer, minimum: 1}
        endLine: {type: integer, minimum: 1}
        code: {type: string, minLength: 1}
