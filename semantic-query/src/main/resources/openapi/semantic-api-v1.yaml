        "properties": {
          "context": { "$ref": "#/components/schemas/SourceContext", "description": "Exact repositoryId and full lowercase commit SHA returned by get_context." },
          "path": { "type": "string", "minLength": 1, "description": "Literal repository-relative source path; colon suffixes are not parsed." },
          "view": { "type": "string", "enum": ["auto", "raw", "summary"], "default": "auto", "description": "Lowercase request enum. Auto with a selector reads raw; without selectors, eligible Java with at least 100 original content lines may use fold metadata, otherwise it reads raw. Raw returns original source and never accesses an index. Summary requires whole-file fold capability and fails rather than falling back." },
          "startLine": { "type": "integer", "minimum": 1, "description": "Optional one-based open-ended selection through EOF; exclusive with ranges and tailLines." },
          "ranges": { "type": "array", "minItems": 1, "maxItems": 20, "items": { "$ref": "#/components/schemas/LineRange" }, "description": "One to 20 inclusive line ranges; exclusive with startLine/tailLines. Overlaps and adjacent windows merge after context expansion." },
          "tailLines": { "type": "integer", "minimum": 1, "maximum": 500, "description": "Optional count of final existing content lines; exclusive with startLine/ranges." },
          "maxLines": { "type": "integer", "minimum": 1, "maximum": 500, "default": 200, "description": "Per-page source line bound, not a total selection limit." },
          "contextBefore": { "type": "integer", "minimum": 0, "maximum": 20, "description": "Leading range context only. Auto single-range defaults to 1; multi-range defaults to 0. Raw requires 0." },
          "contextAfter": { "type": "integer", "minimum": 0, "maximum": 20, "description": "Trailing range context only. Auto single-range defaults to 3; multi-range defaults to 0. Raw requires 0." },
          "indexGeneration": { "type": "string", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", "description": "Optional canonical exact generation pin, only with explicit summary and no selector. Unavailable pins fail; never fall back." },
          "cursor": { "type": "string", "minLength": 1, "description": "Opaque position token; continue with identical context, path, view, selectors, line/context limits and optional generation pin." }
        },
        "required": ["context", "path"],
        "additionalProperties": false
      },
      "SearchCodeRequest": {
        "type": "object",
        "description": "Strict request for literal Java declaration-name search in one exact source revision.",
        "properties": {
          "context": { "$ref": "#/components/schemas/SourceContext", "description": "Exact repositoryId and full lowercase commit SHA returned by get_context." },
          "query": { "type": "string", "minLength": 1, "maxLength": 256, "pattern": "^[^\\r\\n\\u0000]+$", "description": "Nonempty single-line literal of at most 256 Unicode code points; CR, LF and NUL are forbidden." },
          "match": { "type": "string", "enum": ["exact", "prefix"], "description": "Required mode: exact matches the complete name; prefix matches its beginning. Matching is literal and case-sensitive." },
          "kinds": { "type": "array", "items": { "type": "string", "enum": ["CLASS", "INTERFACE", "RECORD", "ENUM", "ANNOTATION_TYPE", "METHOD", "CONSTRUCTOR", "FIELD", "RECORD_COMPONENT", "ENUM_CONSTANT", "ANNOTATION_MEMBER"] }, "description": "Optional declaration-kind allowlist." },
          "owner": { "type": "string", "description": "Optional exact lexical owner label; it is not type resolution or substring matching." },
          "directory": { "type": "string", "default": "", "description": "Repository-relative directory and descendants; empty string selects root." },
          "limit": { "type": "integer", "minimum": 1, "maximum": 100, "default": 20, "description": "Maximum returned declarations; default 20, range 1–100." },
          "cursor": { "type": "string", "minLength": 1, "description": "Opaque cursor bound to exact context, generation, query, match and every filter; pass unchanged." },
          "indexGeneration": { "type": "string", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", "description": "Optional canonical UUID pin for one immutable published generation." }
        },
        "required": ["context", "query", "match"],
        "additionalProperties": false
      },
      "OutlineRequest": {
        "type": "object",
        "description": "Strict request for syntax outline of one existing repository-relative file.",
        "properties": {
          "context": { "$ref": "#/components/schemas/SourceContext", "description": "Exact repositoryId and full lowercase commit SHA returned by get_context." },
          "path": { "type": "string", "minLength": 1, "description": "Existing repository-relative file path in that exact source revision." },
          "limit": { "type": "integer", "minimum": 1, "maximum": 100, "default": 20, "description": "Maximum returned declarations; default 20, range 1–100." },
          "cursor": { "type": "string", "minLength": 1, "description": "Opaque cursor bound to exact context, path and generation; pass unchanged." },
          "indexGeneration": { "type": "string", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", "description": "Optional canonical UUID pin for one immutable published generation." }
        },
        "required": ["context", "path"],
        "additionalProperties": false
      },
      "EntryPointsRequest": {
        "type": "object",
        "description": "Strict request for syntax-recognized Java entry candidates.",
        "properties": {
          "context": { "$ref": "#/components/schemas/SourceContext", "description": "Exact repositoryId and full lowercase commit SHA returned by get_context." },
          "candidateKinds": { "type": "array", "items": { "type": "string", "enum": ["MAIN", "HTTP_MAPPING", "SCHEDULED", "RABBIT_LISTENER"] }, "description": "Optional candidate-kind allowlist." },
          "directory": { "type": "string", "default": "", "description": "Repository-relative directory and descendants; empty string selects root." },
          "limit": { "type": "integer", "minimum": 1, "maximum": 100, "default": 20, "description": "Maximum returned candidates; default 20, range 1–100." },
          "cursor": { "type": "string", "minLength": 1, "description": "Opaque cursor bound to exact context, generation and filters; pass unchanged." },
          "indexGeneration": { "type": "string", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", "description": "Optional canonical UUID pin for one immutable published generation." }
        },
        "required": ["context"],
        "additionalProperties": false
      },
