    "/api/v1/source": {
      "post": {
        "operationId": "read_source",
        "summary": "Read bounded source text in one exact context to verify navigation or syntax evidence.",
        "description": "Read one exact source path with view auto|raw|summary (default auto), one optional mutually exclusive selector (startLine, 1-20 inclusive ranges, or tailLines), and per-page maxLines (default 200, maximum 500). Raw and selector reads preserve the original bytes; unselected auto may choose an eligible Java structural summary, with effective view and safe summary outcome explicit. Summary has no selector, never silently falls back, and is bound to one optional indexGeneration. Responses contain canonical source/elision segments with blobId/contentDigest/byteLength provenance, half-open raw UTF-8 byte spans, original LF line ranges, and mid-line flags. A continuation cursor pins exact source, selection, effective view, profile/generation and page position; intentional elision is not a page continuation. Each page is bounded to 500 segments, 65536 source-content bytes, maxLines and 512 KiB complete HTTP/MCP serialized size. Use raw ranges to inspect elided method/constructor bodies before citing behavior.",
        "responses": {
          "200": {
            "description": "Same lossless application result as MCP structuredContent. Successful MCP read_source text content is a numbered presentation, not JSON or source bytes; its display locators, line labels and escapes do not change this schema or the original segment content.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SourceResult"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "401": {
            "description": "Query token required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/QuerySecurityError"
                }
              }
            }
          },
          "403": {
            "description": "Query access disabled",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/QuerySecurityError"
                }
              }
            }
          },
          "404": {
            "description": "Repository, revision or source not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "409": {
            "description": "Source is not prepared, or an explicit structural summary is unavailable (SOURCE_SUMMARY_UNAVAILABLE, with a bounded reason).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "413": {
            "description": "A complete source segment/result and its required metadata cannot fit the response budget (SOURCE_RESULT_TOO_LARGE).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "422": {
            "description": "Unsupported source",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "503": {
            "description": "Source busy or unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          },
          "504": {
            "description": "Source operation timed out",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SemanticQueryError"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReadSourceRequest"
              }
            }
          }
        }
      }
    },
    "/api/v1/search-code": {
      "post": {
        "operationId": "search_code",
        "summary": "Search indexed Java declaration names in one exact source revision.",
        "description": "Requires the full context returned by get_context and an available syntax index. match is mandatory: exact compares the whole declaration name; prefix compares its beginning. Matching is literal and case-sensitive, with no contains, wildcard, regex or fuzzy mode. Use search_text for source occurrences and read_source to verify evidence. Results are syntax-only and coverage can be incomplete. Preserve context, indexGeneration, cursor and all filters unchanged when paging. This read-only endpoint never prepares an index or switches revisions.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/SearchCodeRequest" }
            }
          }
        },
        "responses": {
          "200": { "description": "Same application result as MCP structuredContent and JSON text content.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/IndexDeclarationResult" } } } },
          "400": { "description": "Invalid argument, unknown field, unsupported match mode or malformed cursor.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SemanticQueryError" } } } },
          "401": { "description": "Query token required", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/QuerySecurityError" } } } },
          "403": { "description": "Query access disabled", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/QuerySecurityError" } } } },
          "404": { "description": "Repository, exact source revision or pinned index generation not found.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SemanticQueryError" } } } },
          "409": { "description": "No compatible index is published for this exact source revision.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SemanticQueryError" } } } },
          "413": { "description": "A complete result or its required metadata exceeds the result budget.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SemanticQueryError" } } } },
          "503": { "description": "Index unavailable or shared search capacity is busy.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SemanticQueryError" } } } },
          "504": { "description": "Index operation exceeded its bounded deadline.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SemanticQueryError" } } } }
        }
      }
    },
