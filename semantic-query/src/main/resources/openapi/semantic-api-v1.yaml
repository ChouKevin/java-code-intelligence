openapi: 3.1.0
info:
  title: Semantic Query API
  version: v1
security:
  - ApiToken: []
paths:
  /api/v1/repositories:
    get:
      summary: List visible repositories and their current revisions.
      parameters: [{$ref: '#/components/parameters/Offset'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Repository page., content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryCollection'}}}}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '503': {$ref: '#/components/responses/IndexUnavailable'}
  /api/v1/repositories/{repositoryId}:
    get:
      summary: Read one visible repository and its current revision.
      parameters: [{$ref: '#/components/parameters/RepositoryId'}]
      responses:
        '200': {description: Repository metadata., content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryItem'}}}}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/IndexUnavailable'}
  /api/v1/search-code:
    $ref: '#/components/pathItems/SearchCode'
  /api/v1/fact-source:
    $ref: '#/components/pathItems/FactSource'
  /api/v1/entry-points:
    $ref: '#/components/pathItems/EntryPoints'
  /api/v1/api-routes:
    $ref: '#/components/pathItems/ApiRoutes'
  /api/v1/event-listeners:
    $ref: '#/components/pathItems/EventListeners'
  /api/v1/type-members:
    $ref: '#/components/pathItems/TypeMembers'
  /api/v1/method-implementations:
    $ref: '#/components/pathItems/MethodImplementations'
  /api/v1/references:
    $ref: '#/components/pathItems/References'
  /api/v1/callers:
    $ref: '#/components/pathItems/Callers'
  /api/v1/callees:
    $ref: '#/components/pathItems/Callees'
  /api/v1/git/branches:
    $ref: '#/components/pathItems/GitBranches'
  /api/v1/git/commits:
    $ref: '#/components/pathItems/GitCommits'
  /api/v1/git/comparisons:
    $ref: '#/components/pathItems/GitComparisons'
  /api/v1/git/file-diff:
    $ref: '#/components/pathItems/GitFileDiff'
  /api/v1/git/files:
    $ref: '#/components/pathItems/GitFiles'
  /api/v1/git/file:
    $ref: '#/components/pathItems/GitFile'
  /api/v1/git/search:
    $ref: '#/components/pathItems/GitTextSearch'
  /api/v1/repositories/{repositoryId}/reviews/{reviewId}:
    $ref: '#/components/pathItems/GetReview'
  /api/v1/reviews/search-code:
    $ref: '#/components/pathItems/ReviewSearchCode'
  /api/v1/reviews/fact-source:
    $ref: '#/components/pathItems/ReviewFactSource'
  /api/v1/reviews/entry-points:
    $ref: '#/components/pathItems/ReviewEntryPoints'
  /api/v1/reviews/api-routes:
    $ref: '#/components/pathItems/ReviewApiRoutes'
  /api/v1/reviews/event-listeners:
    $ref: '#/components/pathItems/ReviewEventListeners'
  /api/v1/reviews/type-members:
    $ref: '#/components/pathItems/ReviewTypeMembers'
  /api/v1/reviews/method-implementations:
    $ref: '#/components/pathItems/ReviewMethodImplementations'
  /api/v1/reviews/references:
    $ref: '#/components/pathItems/ReviewReferences'
  /api/v1/reviews/callers:
    $ref: '#/components/pathItems/ReviewCallers'
  /api/v1/reviews/callees:
    $ref: '#/components/pathItems/ReviewCallees'
components:
  parameters:
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RepositoryId'}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  pathItems:
    GitBranches:
      post:
        summary: List immutable remote branch heads from one authorized Git catalog.
        requestBody: {$ref: '#/components/requestBodies/GitBranchRequest'}
        responses:
          '200': {description: Catalog-pinned branch page., content: {application/json: {schema: {$ref: '#/components/schemas/GitBranchCollection'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/GitEvidenceNotReady'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    GitCommits:
      post:
        summary: List immutable commits reachable from a catalog-pinned branch head.
        requestBody: {$ref: '#/components/requestBodies/GitCommitRequest'}
        responses:
          '200': {description: History-pinned commit page., content: {application/json: {schema: {$ref: '#/components/schemas/GitCommitCollection'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/GitEvidenceNotReady'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    GitComparisons:
      post:
        summary: List one immutable direct comparison of exact Git revisions.
        requestBody: {$ref: '#/components/requestBodies/GitComparisonRequest'}
        responses:
          '200': {description: Exact comparison page., content: {application/json: {schema: {$ref: '#/components/schemas/GitComparisonCollection'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/GitEvidenceNotReady'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    GitFileDiff:
      post:
        summary: Read one bounded patch from an immutable exact comparison.
        requestBody: {$ref: '#/components/requestBodies/GitFileDiffRequest'}
        responses:
          '200': {description: Exact change patch., content: {application/json: {schema: {$ref: '#/components/schemas/GitFileDiffResult'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/GitEvidenceNotReady'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    GitFiles:
      post:
        summary: List direct entries from one exact READY Git snapshot directory.
        requestBody: {$ref: '#/components/requestBodies/GitFileListRequest'}
        responses:
          '200': {description: Snapshot directory page and immutable content coverage., content: {application/json: {schema: {$ref: '#/components/schemas/GitFileCollection'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/GitEvidenceNotReady'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    GitFile:
      post:
        summary: Read a bounded UTF-8 page from one exact READY Git snapshot file.
        requestBody: {$ref: '#/components/requestBodies/GitFileReadRequest'}
        responses:
          '200': {description: Exact source page with optional continuation cursor., content: {application/json: {schema: {$ref: '#/components/schemas/GitFileContent'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/GitEvidenceNotReady'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    GitTextSearch:
      post:
        summary: Search literal UTF-8 text in one exact READY Git snapshot.
        requestBody: {$ref: '#/components/requestBodies/GitTextSearchRequest'}
        responses:
          '200': {description: Bounded literal-search page with optional continuation cursor., content: {application/json: {schema: {$ref: '#/components/schemas/GitTextSearchResult'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/GitEvidenceNotReady'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    SearchCode:
      post:
        summary: Search exact indexed code. Copy repository ID and revision from Semantic results.
        requestBody: {$ref: '#/components/requestBodies/SearchCodeRequest'}
        responses:
          '200': {description: Revision-pinned collection page., content: {application/json: {schema: {$ref: '#/components/schemas/SearchCodeResult'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/RevisionOutdated'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    FactSource:
      post:
        summary: Expand exact source for one returned fact ID.
        requestBody: {$ref: '#/components/requestBodies/FactSourceRequest'}
        responses:
          '200': {description: Exact source and fact ranges., content: {application/json: {schema: {$ref: '#/components/schemas/FactSourceResult'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/RevisionOutdated'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    EntryPoints:
      post:
        summary: List HTTP, messaging, and scheduled entry points.
        requestBody: {$ref: '#/components/requestBodies/EntryPointRequest'}
        responses:
          '200': {description: Revision-pinned collection page., content: {application/json: {schema: {$ref: '#/components/schemas/EntryPointCollectionResult'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/RevisionOutdated'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    ApiRoutes:
      post:
        summary: Find routes for one exact method and path.
        requestBody: {$ref: '#/components/requestBodies/ApiRouteRequest'}
        responses:
          '200': {description: Revision-pinned collection page., content: {application/json: {schema: {$ref: '#/components/schemas/EntryPointCollectionResult'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/RevisionOutdated'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    EventListeners:
      post:
        summary: Find listeners for one exact fully qualified event type.
        requestBody: {$ref: '#/components/requestBodies/EventListenerRequest'}
        responses:
          '200': {description: Revision-pinned collection page., content: {application/json: {schema: {$ref: '#/components/schemas/EventListenerCollectionResult'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/RevisionOutdated'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    TypeMembers:
      post:
        summary: List members of one returned type fact ID.
        requestBody: {$ref: '#/components/requestBodies/TypeMemberRequest'}
        responses:
          '200': {description: Revision-pinned collection page., content: {application/json: {schema: {$ref: '#/components/schemas/TypeMemberCollectionResult'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/RevisionOutdated'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    MethodImplementations:
      post:
        summary: Find direct implementations or overrides of one returned method fact ID.
        requestBody: {$ref: '#/components/requestBodies/MethodRelationRequest'}
        responses:
          '200': {description: Revision-pinned collection page., content: {application/json: {schema: {$ref: '#/components/schemas/ImplementationCollectionResult'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/RevisionOutdated'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    References:
      post:
        summary: Find exact references to one returned declaration fact ID.
        requestBody: {$ref: '#/components/requestBodies/RelationRequest'}
        responses:
          '200': {description: Revision-pinned collection page., content: {application/json: {schema: {$ref: '#/components/schemas/ReferenceCollectionResult'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/RevisionOutdated'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    Callers:
      post:
        summary: Find direct callers of one returned method fact ID.
        requestBody: {$ref: '#/components/requestBodies/MethodRelationRequest'}
        responses:
          '200': {description: Revision-pinned collection page., content: {application/json: {schema: {$ref: '#/components/schemas/CallerCollectionResult'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/RevisionOutdated'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    Callees:
      post:
        summary: Find direct callees of one returned method fact ID.
        requestBody: {$ref: '#/components/requestBodies/MethodRelationRequest'}
        responses:
          '200': {description: Revision-pinned collection page., content: {application/json: {schema: {$ref: '#/components/schemas/CalleeCollectionResult'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/RevisionOutdated'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    GetReview:
      get:
        summary: Discover safe metadata for one READY immutable review.
        parameters: [{$ref: '#/components/parameters/RepositoryId'}, {name: reviewId, in: path, required: true, schema: {$ref: '#/components/schemas/ReviewId'}}]
        responses:
          '200': {description: Safe review metadata., content: {application/json: {schema: {$ref: '#/components/schemas/ReviewDetails'}}}}
          '400': {$ref: '#/components/responses/InvalidArgument'}
          '401': {$ref: '#/components/responses/AuthenticationRequired'}
          '403': {$ref: '#/components/responses/AccessForbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/ReviewNotReady'}
          '503': {$ref: '#/components/responses/IndexUnavailable'}
    ReviewSearchCode:
      post:
        summary: Search exact indexed code on one immutable READY review side.
        requestBody: {$ref: '#/components/requestBodies/ReviewSearchCodeRequest'}
        responses: {'200': {description: Review-scoped search page., content: {application/json: {schema: {$ref: '#/components/schemas/ReviewSearchCodeResult'}}}}, '400': {$ref: '#/components/responses/InvalidArgument'}, '401': {$ref: '#/components/responses/AuthenticationRequired'}, '403': {$ref: '#/components/responses/AccessForbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/ReviewNotReady'}, '503': {$ref: '#/components/responses/IndexUnavailable'}}
    ReviewFactSource:
      post:
        summary: Expand exact source on one immutable READY review side.
        requestBody: {$ref: '#/components/requestBodies/ReviewFactSourceRequest'}
        responses: {'200': {description: Review-scoped fact source., content: {application/json: {schema: {$ref: '#/components/schemas/ReviewFactSourceResult'}}}}, '400': {$ref: '#/components/responses/InvalidArgument'}, '401': {$ref: '#/components/responses/AuthenticationRequired'}, '403': {$ref: '#/components/responses/AccessForbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/ReviewNotReady'}, '503': {$ref: '#/components/responses/IndexUnavailable'}}
    ReviewEntryPoints:
      post:
        summary: List entry points on one immutable READY review side.
        requestBody: {$ref: '#/components/requestBodies/ReviewEntryPointRequest'}
        responses: {'200': {description: Review-scoped entry point page., content: {application/json: {schema: {$ref: '#/components/schemas/ReviewEntryPointResult'}}}}, '400': {$ref: '#/components/responses/InvalidArgument'}, '401': {$ref: '#/components/responses/AuthenticationRequired'}, '403': {$ref: '#/components/responses/AccessForbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/ReviewNotReady'}, '503': {$ref: '#/components/responses/IndexUnavailable'}}
    ReviewApiRoutes:
      post:
        summary: Find exact HTTP routes on one immutable READY review side.
        requestBody: {$ref: '#/components/requestBodies/ReviewApiRouteRequest'}
        responses: {'200': {description: Review-scoped route page., content: {application/json: {schema: {$ref: '#/components/schemas/ReviewEntryPointResult'}}}}, '400': {$ref: '#/components/responses/InvalidArgument'}, '401': {$ref: '#/components/responses/AuthenticationRequired'}, '403': {$ref: '#/components/responses/AccessForbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/ReviewNotReady'}, '503': {$ref: '#/components/responses/IndexUnavailable'}}
    ReviewEventListeners:
      post:
        summary: Find exact event listeners on one immutable READY review side.
        requestBody: {$ref: '#/components/requestBodies/ReviewEventListenerRequest'}
        responses: {'200': {description: Review-scoped listener page., content: {application/json: {schema: {$ref: '#/components/schemas/ReviewEventListenerResult'}}}}, '400': {$ref: '#/components/responses/InvalidArgument'}, '401': {$ref: '#/components/responses/AuthenticationRequired'}, '403': {$ref: '#/components/responses/AccessForbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/ReviewNotReady'}, '503': {$ref: '#/components/responses/IndexUnavailable'}}
    ReviewTypeMembers:
      post:
        summary: List type members on one immutable READY review side.
        requestBody: {$ref: '#/components/requestBodies/ReviewTypeMemberRequest'}
        responses: {'200': {description: Review-scoped member page., content: {application/json: {schema: {$ref: '#/components/schemas/ReviewTypeMemberResult'}}}}, '400': {$ref: '#/components/responses/InvalidArgument'}, '401': {$ref: '#/components/responses/AuthenticationRequired'}, '403': {$ref: '#/components/responses/AccessForbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/ReviewNotReady'}, '503': {$ref: '#/components/responses/IndexUnavailable'}}
    ReviewMethodImplementations:
      post:
        summary: Find method implementations on one immutable READY review side.
        requestBody: {$ref: '#/components/requestBodies/ReviewMethodRelationRequest'}
        responses: {'200': {description: Review-scoped implementation page., content: {application/json: {schema: {$ref: '#/components/schemas/ReviewImplementationResult'}}}}, '400': {$ref: '#/components/responses/InvalidArgument'}, '401': {$ref: '#/components/responses/AuthenticationRequired'}, '403': {$ref: '#/components/responses/AccessForbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/ReviewNotReady'}, '503': {$ref: '#/components/responses/IndexUnavailable'}}
    ReviewReferences:
      post:
        summary: Find exact references on one immutable READY review side.
        requestBody: {$ref: '#/components/requestBodies/ReviewRelationRequest'}
        responses: {'200': {description: Review-scoped reference page., content: {application/json: {schema: {$ref: '#/components/schemas/ReviewReferenceResult'}}}}, '400': {$ref: '#/components/responses/InvalidArgument'}, '401': {$ref: '#/components/responses/AuthenticationRequired'}, '403': {$ref: '#/components/responses/AccessForbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/ReviewNotReady'}, '503': {$ref: '#/components/responses/IndexUnavailable'}}
    ReviewCallers:
      post:
        summary: Find direct callers on one immutable READY review side.
        requestBody: {$ref: '#/components/requestBodies/ReviewMethodRelationRequest'}
        responses: {'200': {description: Review-scoped caller page., content: {application/json: {schema: {$ref: '#/components/schemas/ReviewCallerResult'}}}}, '400': {$ref: '#/components/responses/InvalidArgument'}, '401': {$ref: '#/components/responses/AuthenticationRequired'}, '403': {$ref: '#/components/responses/AccessForbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/ReviewNotReady'}, '503': {$ref: '#/components/responses/IndexUnavailable'}}
    ReviewCallees:
      post:
        summary: Find direct callees on one immutable READY review side.
        requestBody: {$ref: '#/components/requestBodies/ReviewMethodRelationRequest'}
        responses: {'200': {description: Review-scoped callee page., content: {application/json: {schema: {$ref: '#/components/schemas/ReviewCalleeResult'}}}}, '400': {$ref: '#/components/responses/InvalidArgument'}, '401': {$ref: '#/components/responses/AuthenticationRequired'}, '403': {$ref: '#/components/responses/AccessForbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/ReviewNotReady'}, '503': {$ref: '#/components/responses/IndexUnavailable'}}
  requestBodies:
    GitBranchRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GitBranchRequest'}}}}
    GitCommitRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GitCommitRequest'}}}}
    GitComparisonRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GitComparisonRequest'}}}}
    GitFileDiffRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GitFileDiffRequest'}}}}
    GitFileListRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GitFileListRequest'}}}}
    GitFileReadRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GitFileReadRequest'}}}}
    GitTextSearchRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GitTextSearchRequest'}}}}
    SearchCodeRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SearchCodeRequest'}}}}
    FactSourceRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FactSourceRequest'}}}}
    EntryPointRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EntryPointRequest'}}}}
    ApiRouteRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApiRouteRequest'}}}}
    EventListenerRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EventListenerRequest'}}}}
    TypeMemberRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TypeMemberRequest'}}}}
    MethodRelationRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MethodRelationRequest'}}}}
    RelationRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RelationRequest'}}}}
    ReviewSearchCodeRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewSearchCodeRequest'}}}}
    ReviewFactSourceRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewFactSourceRequest'}}}}
    ReviewEntryPointRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewEntryPointRequest'}}}}
    ReviewApiRouteRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewApiRouteRequest'}}}}
    ReviewEventListenerRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewEventListenerRequest'}}}}
    ReviewTypeMemberRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewTypeMemberRequest'}}}}
    ReviewMethodRelationRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewMethodRelationRequest'}}}}
    ReviewRelationRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewRelationRequest'}}}}
  responses:
    AuthenticationRequired:
      description: X-Api-Token is required for HTTP query operations.
    AccessForbidden:
      description: Query access is disabled.
    InvalidArgument:
      description: Request does not satisfy the operation contract.
      content: {application/json: {schema: {$ref: '#/components/schemas/SemanticQueryError'}}}
    NotFound:
      description: Repository or fact was not found.
      content: {application/json: {schema: {$ref: '#/components/schemas/SemanticQueryError'}}}
    GitEvidenceNotReady:
      description: The requested immutable Git evidence has not reached READY; retry later with the same identity.
      content: {application/json: {schema: {$ref: '#/components/schemas/SemanticQueryError'}}}
    ReviewNotReady:
      description: The requested review has not published immutable READY evidence; retry later with the same identity.
      content: {application/json: {schema: {$ref: '#/components/schemas/SemanticQueryError'}}}
    RevisionOutdated:
      description: Retry only after replacing revision with the returned exact currentRevision.
      content: {application/json: {schema: {$ref: '#/components/schemas/SemanticQueryError'}}}
    IndexUnavailable:
      description: The semantic index is temporarily unavailable.
      content: {application/json: {schema: {$ref: '#/components/schemas/SemanticQueryError'}}}
  schemas:
    RepositoryId: {type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}
    Revision: {type: string, minLength: 40, maxLength: 40, pattern: '^[0-9a-f]{40}$'}
    FactId: {type: string, pattern: '^[0-9a-f]{64}$'}
    GitEvidenceId: {type: string, format: uuid}
    ReviewId: {type: string, minLength: 1}
    ReviewSide: {type: string, enum: [A, B]}
    GitBranchRequest:
      type: object
      additionalProperties: false
      required: [repositoryId]
      properties:
        repositoryId: {$ref: '#/components/schemas/RepositoryId'}
        catalogId: {$ref: '#/components/schemas/GitEvidenceId'}
        offset: {type: integer, minimum: 0, default: 0}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
    GitCommitRequest:
      type: object
      additionalProperties: false
      required: [repositoryId, historyId, revision]
      properties:
        repositoryId: {$ref: '#/components/schemas/RepositoryId'}
        historyId: {$ref: '#/components/schemas/GitEvidenceId'}
        revision: {$ref: '#/components/schemas/Revision'}
