          "segments": { "type": "array", "maxItems": 500, "items": { "$ref": "#/components/schemas/Segment" }, "description": "Ordered source chunks and intentional elisions; never concatenate elisions as source." },
          "hasMore": { "type": "boolean", "description": "Whether this frozen view and selection have another page; elision alone does not set this." },
          "nextCursor": { "anyOf": [{ "type": "string", "minLength": 1 }, { "type": "null" }], "description": "Authenticated process-lifetime continuation bound to source, request, effective selection/view and generation. Modification or Query restart returns INVALID_ARGUMENT; restart reading with the same exact context and retained generation pin." },
          "stopReason": { "type": "string", "enum": ["COMPLETE", "LINE_BUDGET", "CONTENT_BUDGET", "SEGMENT_BUDGET", "WIRE_BUDGET"], "description": "Completion or page budget stop; intentional fold is not a stop reason." },
          "navigationHint": { "type": "boolean", "description": "Whether this source file is marked as a navigation hint." }
        },
        "required": ["context", "path", "blobId", "contentDigest", "byteLength", "requestedView", "effectiveView", "requestedSelection", "effectiveSelection", "summaryOutcome", "segments", "hasMore", "stopReason", "navigationHint"],
        "additionalProperties": false
      },
