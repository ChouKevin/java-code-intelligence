    "/api/v1/files": {
      "post": {
        "operationId": "list_files",
        "summary": "Browse files in one exact published context; preserve source-bound page cursors.",
        "description": "Browse the inventory under one exact context from get_context. depth defaults to 1; depth 2 emits flat preorder with at most 12 immediate children per direct-child directory. Each directory reports childPreview COMPLETE, ELIDED or NOT_EXPANDED; ELIDED requires an explicit list_files call on that directory. Global limit counts all emitted entries (default 20, maximum 100); cursors bind context, directory, depth, preview policy and limit, and resume at the true next emitted item. Preserve every request field unchanged when continuing. Full results are bounded to 512 KiB HTTP/MCP serialized size; a whole-item overflow fails with SOURCE_RESULT_TOO_LARGE. Use read_source for original bytes or search_text for literal occurrences; this tool does not search declaration identifiers or switch revisions.",
        "responses": {
          "200": {
            "description": "Same application result as MCP structuredContent and JSON text content.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/FileCollection"
                }
              }
            }
          },
          "400": {
