        snapshotId: {$ref: '#/components/schemas/GitEvidenceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        directory: {type: string}
        offset: {type: integer, minimum: 0, default: 0}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
    GitFileReadRequest:
      type: object
      additionalProperties: false
      required: [repositoryId, snapshotId, revision, path]
      properties:
        repositoryId: {$ref: '#/components/schemas/RepositoryId'}
        snapshotId: {$ref: '#/components/schemas/GitEvidenceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        path: {type: string, minLength: 1}
        startLine: {type: integer, minimum: 1}
        maxLines: {type: integer, minimum: 1, maximum: 500, default: 200}
        cursor: {type: string, minLength: 1}
    GitTextSearchRequest:
      type: object
      additionalProperties: false
      required: [repositoryId, snapshotId, revision, query]
      properties:
        repositoryId: {$ref: '#/components/schemas/RepositoryId'}
        snapshotId: {$ref: '#/components/schemas/GitEvidenceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        query: {type: string, minLength: 1, maxLength: 256}
        directory: {type: string}
        cursor: {type: string, minLength: 1}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
    GitChangeItem:
      type: object
      additionalProperties: false
      required: [changeId, kind, diffStatus]
      properties:
        changeId: {type: string}
        kind: {type: string, enum: [ADD, DELETE, MODIFY, RENAME, MODE]}
        oldPath: {type: string}
        newPath: {type: string}
        oldMode: {type: string}
        newMode: {type: string}
        oldBlobId: {type: string}
        newBlobId: {type: string}
        diffStatus: {type: string}
    GitComparisonCollection:
      type: object
      additionalProperties: false
      required: [repositoryId, comparisonId, previous, current, previousSnapshotId, currentSnapshotId, ancestry, items, page]
      properties:
        repositoryId: {$ref: '#/components/schemas/RepositoryId'}
        comparisonId: {type: string, format: uuid}
        previous: {$ref: '#/components/schemas/Revision'}
        current: {$ref: '#/components/schemas/Revision'}
        previousSnapshotId: {type: string, format: uuid}
        currentSnapshotId: {type: string, format: uuid}
        ancestry: {type: string, enum: [SAME, PREVIOUS_ANCESTOR, CURRENT_ANCESTOR, DIVERGED]}
        items: {type: array, items: {$ref: '#/components/schemas/GitChangeItem'}}
        page: {$ref: '#/components/schemas/Page'}
    GitFileDiffResult:
      type: object
      additionalProperties: false
      required: [repositoryId, comparisonId, previous, current, change, patch]
      properties:
        repositoryId: {$ref: '#/components/schemas/RepositoryId'}
        comparisonId: {type: string, format: uuid}
        previous: {$ref: '#/components/schemas/Revision'}
        current: {$ref: '#/components/schemas/Revision'}
        change: {$ref: '#/components/schemas/GitChangeItem'}
        patch: {type: string}
        nextCursor: {type: string}
    GitFileItem:
      type: object
      additionalProperties: false
      required: [path, pathKey, entryType, byteLength, contentStatus]
      properties:
        path: {type: string}
        pathKey: {type: string}
