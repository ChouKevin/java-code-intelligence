      additionalProperties: false
      required: [container, referenceSite]
      properties:
        container: {$ref: '#/components/schemas/InternalProgramElement'}
        referenceSite: {$ref: '#/components/schemas/RelationSite'}
    SearchCodeResult:
      type: object
      additionalProperties: false
      required: [repositoryId, revision, items, page, sourceCoverage]
      properties:
        repositoryId: {$ref: '#/components/schemas/RepositoryId'}
        revision: {$ref: '#/components/schemas/Revision'}
        items: {type: array, items: {$ref: '#/components/schemas/InternalProgramElement'}}
        page: {$ref: '#/components/schemas/Page'}
        sourceCoverage: {$ref: '#/components/schemas/SourceCoverage'}
    SourceCoverage:
