      "SourceResult": {
        "type": "object",
        "description": "Canonical segmented exact-source result; there is no top-level continuous content alias.",
        "properties": {
          "context": { "$ref": "#/components/schemas/SourceContext", "description": "Exact source repository and revision." },
          "path": { "type": "string", "minLength": 1, "description": "Literal repository-relative source path." },
          "blobId": { "type": "string", "pattern": "^[a-f0-9]{40}$", "description": "Git blob SHA-1 for the original bytes." },
          "contentDigest": { "type": "string", "pattern": "^[a-f0-9]{64}$", "description": "SHA-256 of the original sealed source bytes." },
          "byteLength": { "type": "integer", "minimum": 0, "description": "Complete original source byte length." },
          "requestedView": { "type": "string", "enum": ["AUTO", "RAW", "SUMMARY"], "description": "Requested view; output enum names are uppercase." },
          "effectiveView": { "type": "string", "enum": ["AUTO", "RAW", "SUMMARY"], "description": "Frozen view actually returned for this page sequence." },
          "requestedSelection": { "$ref": "#/components/schemas/Selection", "description": "Original selector and requested context values." },
          "effectiveSelection": { "type": "array", "items": { "$ref": "#/components/schemas/LineRange" }, "description": "Normalized, merged, EOF-clipped inclusive line windows." },
          "summaryOutcome": {
            "type": "string",
            "enum": ["NOT_REQUESTED", "ELIDED", "NO_ELISION", "BELOW_SUMMARY_THRESHOLD", "UNSUPPORTED_LANGUAGE", "INDEX_NOT_READY", "INDEX_UNAVAILABLE", "FOLD_METADATA_UNAVAILABLE", "FILE_PARSE_FAILED", "FILE_UNSUPPORTED", "FILE_TOO_LARGE"],
            "description": "Safe summary status/reason. Raw and selector reads report NOT_REQUESTED; explicit summary failure is an error, never a raw fallback."
          },
          "indexGeneration": {
            "anyOf": [
              { "type": "string", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" },
              { "type": "null" }
            ],
            "description": "Exact immutable generation used by structural summary, if any."
