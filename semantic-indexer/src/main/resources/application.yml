spring:
  mongodb:
    uri: ${SEMANTIC_MONGODB_URI:mongodb://localhost:27017/semantic?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000&socketTimeoutMS=2000}

semantic:
  index-jobs:
    # semantic.index-jobs.poll-delay controls serialized dispatcher polling.
    poll-delay: 1s
  indexer:
    admin-token: ${SEMANTIC_INDEXER_ADMIN_TOKEN:}
  jdtls:
    enabled: ${JDTLS_ENABLED:true}
    home: ${JDTLS_HOME:/opt/jdtls}
    workspace-data-root: ${JDTLS_WORKSPACE_DATA_ROOT:/data/jdtls}
    java-executable: ${JDTLS_JAVA_EXECUTABLE:/opt/java/openjdk/bin/java}
    isolation-mode: ${JDTLS_ISOLATION_MODE:LINUX_UID}
    analysis-uid: ${JDTLS_ANALYSIS_UID:10001}
    analysis-gid: ${JDTLS_ANALYSIS_GID:10001}
    analysis-home: ${JDTLS_ANALYSIS_HOME:/home/analysis}
    startup-timeout: ${JDTLS_STARTUP_TIMEOUT:180s}
    import-timeout: ${JDTLS_IMPORT_TIMEOUT:900s}
    request-timeout: ${JDTLS_REQUEST_TIMEOUT:30s}
    max-active-workspaces: ${JDTLS_MAX_ACTIVE_WORKSPACES:2}
    idle-timeout: ${JDTLS_IDLE_TIMEOUT:30m}
    maintenance-interval: ${JDTLS_MAINTENANCE_INTERVAL:1m}
    max-heap: ${JDTLS_MAX_HEAP:2g}
  data-root: ${SEMANTIC_DATA_ROOT:/data/repos}
  repository-lock-timeout: 5s
  git-username: ${GIT_USERNAME:}
  git-token: ${GIT_TOKEN:}

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO

---
spring:
  config:
    activate:
      on-profile: uat

semantic:
  uat:
    publication-timeout: ${SEMANTIC_UAT_PUBLICATION_TIMEOUT:30s}
