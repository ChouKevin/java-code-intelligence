openapi: 3.0.3
info:
  title: Java Semantic Service Repository API
  version: v1
security:
  - ApiToken: []
paths:
  /v1/repositories:
    get:
      operationId: listRepositories
      responses:
        '200':
          description: Configured repository statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/repositories/{repoId}:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    get:
      operationId: getRepository
      responses:
        '200':
          $ref: '#/components/responses/RepositoryStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/repositories/{repoId}/ensure:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    post:
      operationId: ensureRepository
      responses:
        '200':
          $ref: '#/components/responses/RepositoryStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/repositories/{repoId}/sync:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    post:
      operationId: syncRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRepositoryRequest'
      responses:
        '200':
          $ref: '#/components/responses/RepositoryStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/repositories/{repoId}/checkout:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    post:
      operationId: checkoutRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRepositoryRequest'
      responses:
        '200':
          $ref: '#/components/responses/RepositoryStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/repositories/{repoId}/entry-points:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    get:
      operationId: listEntryPoints
      parameters:
        - name: expectedRevision
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{40}$'
        - name: types
          in: query
          required: false
          schema:
            type: string
            pattern: '^(API|MQ|SCHEDULE)(,(API|MQ|SCHEDULE))*$'
      responses:
        '200':
          $ref: '#/components/responses/EntryPoints'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/analyses/call-graphs/outgoing:
    post:
      operationId: analyzeOutgoingCallGraph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeOutgoingCallGraphRequest'
      responses:
        '200':
          $ref: '#/components/responses/OutgoingCallGraph'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/MutationFailed'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/analyses/call-graphs/incoming:
    post:
      operationId: analyzeIncomingCallGraph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeIncomingCallGraphRequest'
      responses:
        '200':
          $ref: '#/components/responses/IncomingCallGraph'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/MutationFailed'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/api-routes/lookup:
    post:
      operationId: lookupApiRoutes
      description: Queries one repository's route index at an exact revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRouteLookupRequest'
      responses:
        '200':
          $ref: '#/components/responses/ApiRouteCandidates'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/api-routes/suggest:
    post:
      operationId: suggestApiRoutes
      description: Queries one repository's route index at an exact revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRouteSuggestRequest'
      responses:
        '200':
          $ref: '#/components/responses/ApiRouteCandidates'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/discovery/event-listeners:
    post:
      operationId: discoverEventListeners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverEventListenersRequest'
      responses:
        '200':
          $ref: '#/components/responses/EventListenerDiscovery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/discovery/method-implementations:
    post:
      operationId: discoverMethodImplementations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverMethodImplementationsRequest'
      responses:
        '200':
          $ref: '#/components/responses/MethodImplementationDiscovery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/MutationFailed'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/discovery/concepts:
    post:
      operationId: discoverConcepts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverConceptsRequest'
      responses:
        '200':
          $ref: '#/components/responses/ConceptDiscovery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ConceptKindUnavailable'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/discovery/concepts/resolve:
    post:
      operationId: resolveConcept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveConceptRequest'
      responses:
        '200':
          $ref: '#/components/responses/ConceptResolution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/discovery/type-members:
    post:
      operationId: discoverTypeMembers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverTypeMembersRequest'
      responses:
        '200':
          $ref: '#/components/responses/TypeMemberDiscovery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/discovery/source-symbols/resolve:
    post:
      operationId: resolveSourceSymbol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveSourceSymbolRequest'
      responses:
        '200':
          $ref: '#/components/responses/SourceSymbolResolution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/discovery/internal-references:
    post:
      operationId: findInternalReferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalSourceReferenceRequest'
      responses:
        '200':
          description: Revision-pinned repository-local Java references grouped by exact context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalSourceReferenceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/discovery/source-segment:
    post:
      operationId: getSourceSegment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceSegmentRequest'
      responses:
        '200':
          description: RepositorySyntax-authorized source segment limited to 64 KiB UTF-8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSegmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/discovery/method-source:
    post:
      operationId: getMethodSource
      description: Returns the canonical declaration and its first bounded Java source segment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMethodSourceRequest'
      responses:
        '200':
          $ref: '#/components/responses/MethodSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/discovery/evidence-source:
    post:
      operationId: getEvidenceSource
      description: Returns one revision-pinned typed evidence source and its first bounded raw source segment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceSourceRequest'
      responses:
        '200':
          $ref: '#/components/responses/EvidenceSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-Api-Token
  parameters:
    RepoId:
      name: repoId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
  responses:
    RepositoryStatus:
      description: Repository status
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RepositoryStatusResponse'
    EntryPoints:
      description: Revision-bound entry-point inventory
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntryPointsResponse'
    OutgoingCallGraph:
      description: Revision-bound outgoing call graph fragment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OutgoingCallGraphResponse'
    IncomingCallGraph:
      description: Revision-bound incoming call graph fragment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IncomingCallGraphResponse'
    ApiRouteCandidates:
      description: Per-candidate route matches, each bound to its analyzed revision
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiRouteCandidatesResponse'
    EventListenerDiscovery:
      description: Revision-bound event listener discovery candidates and observations
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoverEventListenersResponse'
    MethodImplementationDiscovery:
      description: Revision-bound method implementation discovery candidates and resolution summary
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoverMethodImplementationsResponse'
    ConceptDiscovery:
      description: Revision-bound structured concept discovery candidates and recovery guidance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoverConceptsResponse'
    ConceptResolution:
      description: Revision-bound exact typed concept identity resolution
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResolveConceptResponse'
    ConceptKindUnavailable:
      description: Requested concept kind is declared but inactive in this composition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConceptKindUnavailableResponse'
    TypeMemberDiscovery:
      description: Revision-bound combined type member discovery page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoverTypeMembersResponse'
    EvidenceSource:
      description: Revision-bound typed evidence identity, canonical location, and bounded source segment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EvidenceSourceResponse'
    MethodSource:
      description: Revision-bound canonical method declaration with its first bounded Java source segment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MethodSourceResponse'
    SourceSymbolResolution:
      description: Revision-bound source-only symbol resolution and executable retries
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SourceSymbolResolutionResponse'
    BadRequest:
      description: Invalid repository id or request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Missing or wrong API token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    AuthDisabled:
      description: API token is not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthDisabledErrorResponse'
    NotFound:
      description: Repository or analysis symbol is not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Repository is busy, immutable, not ready, or revision-mismatched
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    UnprocessableEntity:
      description: Analysis symbol could not be resolved
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    MutationFailed:
      description: Sanitized service failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    BadGateway:
      description: Semantic protocol failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ServiceUnavailable:
      description: Semantic engine is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    GatewayTimeout:
      description: Semantic engine request timed out
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    SyncRepositoryRequest:
      type: object
      properties:
        branch:
          type: string
    CheckoutRepositoryRequest:
      type: object
      required:
        - revision
      properties:
        revision:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    AnalyzeOutgoingCallGraphRequest:
      type: object
      additionalProperties: false
      required:
        - repoId
        - expectedRevision
        - target
      properties:
        repoId:
          type: string
          minLength: 1
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        expectedRevision:
          type: string
          minLength: 1
          pattern: '^[0-9a-f]{40}$'
        depth:
          type: integer
          default: 2
          minimum: 1
          maximum: 2
        target:
          $ref: '#/components/schemas/MethodTargetPayload'
    AnalyzeIncomingCallGraphRequest:
      type: object
      additionalProperties: false
      required:
        - repoId
        - expectedRevision
        - target
      properties:
        repoId:
          type: string
          minLength: 1
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        expectedRevision:
          type: string
          minLength: 1
          pattern: '^[0-9a-f]{40}$'
        depth:
          type: integer
          default: 2
          minimum: 1
          maximum: 2
        target:
          $ref: '#/components/schemas/MethodTargetPayload'
    ResolveSourceSymbolRequest:
      type: object
      additionalProperties: false
      required:
        - repoId
        - expectedRevision
        - context
        - symbol
      properties:
        repoId:
          type: string
          minLength: 1
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        expectedRevision:
          type: string
          minLength: 1
          pattern: '^[0-9a-f]{40}$'
        context:
          $ref: '#/components/schemas/SourceSymbolContextPayload'
        symbol:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[\p{L}\p{Nl}\p{Sc}\p{Pc}][\p{L}\p{Nl}\p{Sc}\p{Pc}\p{Mn}\p{Mc}\p{Nd}]*$'
        position:
          $ref: '#/components/schemas/PositionPayload'
    ResolveConceptRequest:
      type: object
      additionalProperties: false
      required:
        - repoId
        - expectedRevision
        - identity
      properties:
        repoId:
          type: string
          minLength: 1
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        expectedRevision:
          type: string
          minLength: 1
          pattern: '^[0-9a-f]{40}$'
        identity:
          $ref: '#/components/schemas/ConceptIdentityResponse'
    SourceSymbolContextPayload:
      type: object
      additionalProperties: false
      required:
        - javaType
      properties:
        javaType:
          $ref: '#/components/schemas/JavaTypeIdentityPayload'
        sourceFile:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
        method:
          $ref: '#/components/schemas/SourceSymbolMethodContextPayload'
    SourceSymbolMethodContextPayload:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[\p{L}\p{Nl}\p{Sc}\p{Pc}][\p{L}\p{Nl}\p{Sc}\p{Pc}\p{Mn}\p{Mc}\p{Nd}]*$'
        parameterTypes:
          type: array
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
    SourceSymbolResolutionResponse:
      type: object
      additionalProperties: false
      required:
        - repoId
        - analyzedRevision
        - status
        - contextCandidates
        - contextCandidateLimits
        - candidates
        - issues
      properties:
        repoId:
          type: string
        analyzedRevision:
          type: string
          pattern: '^[0-9a-f]{40}$'
        status:
          $ref: '#/components/schemas/SourceSymbolResolutionStatus'
        contextCandidates:
          type: array
          items:
            $ref: '#/components/schemas/SourceContextCandidateResponse'
        contextCandidateLimits:
          $ref: '#/components/schemas/BoundedResultResponse'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/SourceSymbolCandidateResponse'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/SourceSymbolIssueSummaryResponse'
    SourceSymbolResolutionStatus:
      type: string
      enum:
        - RESOLVED
        - CONTEXT_NOT_FOUND
        - SYMBOL_NOT_FOUND
        - AMBIGUOUS_CONTEXT
        - AMBIGUOUS_SYMBOL
        - AMBIGUOUS_OCCURRENCE
        - UNRESOLVED_BINDING
        - POSITION_MISMATCH
    BoundedResultResponse:
      type: object
      additionalProperties: false
      required:
        - limit
