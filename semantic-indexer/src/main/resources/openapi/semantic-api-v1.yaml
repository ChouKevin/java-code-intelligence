    GraphTraversalState:
      type: string
      enum:
        - EXPANDED
        - DEPTH_BOUNDARY
        - BUDGET_CUTOFF
        - OPAQUE
        - EXTERNAL
      description: >-
        How far the service traversed this node in this response-local fragment.
        EXPANDED: source was hydrated and its own calls were traversed.
        DEPTH_BOUNDARY: source was hydrated but traversal stopped at the requested depth.
        BUDGET_CUTOFF: node identity only; omitted from expansion because the node budget was reached.
        OPAQUE: evidence-terminal node; not expandable, not a re-root continuation.
        EXTERNAL: node lies outside the analyzed source set.
    DispatchKind:
      type: string
      enum:
        - SYNCHRONOUS
        - ASYNC
      description: >-
        How the node's own declaration is invoked, independent of any specific edge.
        SYNCHRONOUS: ordinary in-thread invocation, or a node with no observable dispatch annotation.
        ASYNC: the declaration carries @Async; callers return immediately and execution happens on a separate thread.
    GraphLimitReason:
      type: string
      enum:
        - NONE
        - NODE_BUDGET
