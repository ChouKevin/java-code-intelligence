          type: string
          minLength: 1
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        expectedRevision:
          type: string
          minLength: 1
          pattern: '^[0-9a-f]{40}$'
        target:
          $ref: '#/components/schemas/MethodTargetPayload'
    EvidenceSourceRequest:
      type: object
      additionalProperties: false
      required:
        - repoId
        - expectedRevision
        - identity
      properties:
        repoId:
          type: string
          minLength: 1
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        expectedRevision:
          type: string
          minLength: 1
          pattern: '^[0-9a-f]{40}$'
        identity:
          $ref: '#/components/schemas/EvidenceSourceIdentityPayload'
    EvidenceSourceIdentityPayload:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - ANNOTATION_SQL
            - MAPPER_STATEMENT
            - MAPPER_FRAGMENT
        statementIdentity:
          $ref: '#/components/schemas/MapperStatementIdentityPayload'
        fragmentIdentity:
          $ref: '#/components/schemas/MapperFragmentIdentityPayload'
      oneOf:
        - properties:
            kind:
              enum: [ANNOTATION_SQL, MAPPER_STATEMENT]
          required: [statementIdentity]
          not:
            required: [fragmentIdentity]
        - properties:
            kind:
              enum: [MAPPER_FRAGMENT]
          required: [fragmentIdentity]
          not:
            required: [statementIdentity]
    MapperFragmentIdentityPayload:
      type: object
      additionalProperties: false
      required:
        - namespace
        - fragmentId
        - resourcePath
        - documentOrdinal
        - representation
      properties:
        namespace:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
        fragmentId:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
        resourcePath:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
          description: Repository-relative mapper resource path
        documentOrdinal:
          type: integer
          minimum: 0
        representation:
          type: string
          enum:
            - MAPPER_XML_ELEMENT
    SourceTypeIdentityPayload:
      type: object
      additionalProperties: false
      required:
        - javaType
        - sourceFile
      properties:
        javaType:
          $ref: '#/components/schemas/JavaTypeIdentityPayload'
        sourceFile:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: '^[^\u0000-\u001F\u007F-\u009F]*[^\u0000-\u0020\u007F-\u009F\u1680\u2000-\u2006\u2008-\u200A\u2028-\u2029\u205F\u3000][^\u0000-\u001F\u007F-\u009F]*$'
          description: Repository-relative source path. The server additionally enforces normalized path segments.
    MethodTargetPayload:
      type: object
      additionalProperties: false
      required:
        - sourceType
        - methodName
        - parameterTypes
      properties:
        sourceType:
          $ref: '#/components/schemas/SourceTypeIdentityPayload'
        methodName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[\p{L}\p{Nl}\p{Sc}\p{Pc}][\p{L}\p{Nl}\p{Sc}\p{Pc}\p{Mn}\p{Mc}\p{Nd}]*$'
          description: Portable Unicode-category approximation of the server's Java identifier validation.
        parameterTypes:
          type: array
          minItems: 0
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
    SourceMemberIdentityPayload:
      oneOf:
        - $ref: '#/components/schemas/TypeMemberIdentityPayload'
        - $ref: '#/components/schemas/MethodScopedIdentityPayload'
      discriminator:
        propertyName: scope
        mapping:
          TYPE: '#/components/schemas/TypeMemberIdentityPayload'
          METHOD: '#/components/schemas/MethodScopedIdentityPayload'
