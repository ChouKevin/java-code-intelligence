        - limitReason
      properties:
        requestedDepth:
          type: integer
          minimum: 1
          maximum: 2
        expandedNodeCount:
          type: integer
          minimum: 0
          description: Number of depth-2 source-expansion nodes included in this fragment.
        nodeBudget:
          type: integer
          minimum: 0
          description: Server limit for depth-2 source-expansion nodes; it never removes a root direct call.
        rootDirectCallsComplete:
          type: boolean
          description: Whether root direct calls for the requested traversal direction are complete.
        limitReason:
          $ref: '#/components/schemas/GraphLimitReason'
    GraphNode:
