openapi: 3.1.0
info:
  title: Private source preparation API
  version: 1.0.0
security:
  - adminToken: []
components:
  securitySchemes:
    adminToken:
      type: apiKey
      in: header
      name: X-Api-Token
  schemas:
    Job:
      type: object
      required: [formatVersion, jobId, repositoryId, requestId, defaultBranch, phase, acceptedAt]
      properties:
        formatVersion: {type: integer, const: 1}
        jobId: {type: string}
        repositoryId: {type: string}
        requestId: {type: string, format: uuid}
        defaultBranch: {type: string}
        requestedRevision: {type: string, pattern: '^[0-9a-f]{40}$'}
        resolvedRevision: {type: string, pattern: '^[0-9a-f]{40}$'}
        phase: {type: string, enum: [ACCEPTED, RUNNING, COMPLETE, FAILED]}
        acceptedAt: {type: string, format: date-time}
        expectedCurrent: {type: object}
        publication: {type: object}
        failureCode: {type: string}
    Failure:
      type: object
      required: [code, message, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
        jobId: {type: string}
        requestId: {type: string, format: uuid}
paths:
  /index/repositories/{repositoryId}/source:
    parameters:
      - name: repositoryId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: prepare_source
      description: Persist acceptance before returning 202. Lost response requires lookup by the original requestId, not resubmission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: {type: string, format: uuid}
                revision: {type: string, pattern: '^[0-9a-f]{40}$'}
      responses:
        '202':
          description: Durable acceptance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '400':
          description: Invalid JSON envelope or preparation argument
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '401':
          description: Admin token missing or invalid
        '403':
          description: Index administration disabled
        '409':
          description: Request identity reused or repository active
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '404':
          description: Repository not configured
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '503':
          description: Source preparation unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
  /index/repositories/{repositoryId}/jobs:
    parameters:
      - name: repositoryId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: get_job
      description: Exactly one of jobId and original requestId is required.
      parameters:
        - name: jobId
          in: query
          schema: {type: string}
        - name: requestId
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Repository-scoped durable job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '400':
          description: Invalid or ambiguous job selector
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '401':
          description: Admin token missing or invalid
        '403':
          description: Index administration disabled
        '404':
          description: Unknown original request or job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '503':
          description: Source preparation unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
