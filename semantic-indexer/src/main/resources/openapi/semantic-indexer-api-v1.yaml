openapi: 3.0.3
info:
  title: Semantic Indexer Admin API
  version: v1
  description: >-
    Private asynchronous administration API. Every build command selects its
    source revision before returning an accepted job; it never indexes inline.
security:
  - indexerAdminToken: []
paths:
  /index/uat/publication/arm:
    post:
      operationId: armUatPublication
      responses:
        '200':
          description: A new in-memory publication cycle was armed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationCycle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IndexConflict' }
  /index/uat/publication/release:
    post:
      operationId: releaseUatPublication
      responses:
        '200': { description: The current in-memory publication cycle is opened. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /index/uat/repositories/{repoId}/reset:
    post:
      operationId: resetUatRepositoryIndex
      parameters: [ { $ref: '#/components/parameters/RepositoryId' } ]
      responses:
        '202': { $ref: '#/components/responses/IndexJobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/RepositoryNotFound' }
        '409': { $ref: '#/components/responses/IndexConflict' }
  /index/repositories/{repoId}/publication:
    get:
      operationId: getRepositoryPublication
      parameters: [ { $ref: '#/components/parameters/RepositoryId' } ]
      responses:
        '200': { $ref: '#/components/responses/IndexPublication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/RepositoryNotFound' }
  /index/repositories/{repoId}/jobs/{jobId}:
    get:
      operationId: getRepositoryIndexJob
      parameters: [ { $ref: '#/components/parameters/RepositoryId' }, { $ref: '#/components/parameters/IndexJobId' } ]
      responses:
        '200': { $ref: '#/components/responses/IndexJobStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IndexJobNotFound' }
  /index/repositories/{repoId}/ensure:
    post:
      operationId: ensureRepositoryIndex
      parameters: [ { $ref: '#/components/parameters/RepositoryId' } ]
      responses:
        '202': { $ref: '#/components/responses/IndexJobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/RepositoryNotFound' }
        '409': { $ref: '#/components/responses/IndexConflict' }
  /index/repositories/{repoId}/sync:
    post:
      operationId: syncRepositoryIndex
      parameters: [ { $ref: '#/components/parameters/RepositoryId' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncRequest' }
      responses:
        '202': { $ref: '#/components/responses/IndexJobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/RepositoryNotFound' }
        '409': { $ref: '#/components/responses/IndexConflict' }
  /index/repositories/{repoId}/checkout:
    post:
      operationId: checkoutRepositoryIndex
      parameters: [ { $ref: '#/components/parameters/RepositoryId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '202': { $ref: '#/components/responses/IndexJobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/RepositoryNotFound' }
        '409': { $ref: '#/components/responses/IndexConflict' }
  /index/repositories/{repoId}/rebuild:
    post:
      operationId: rebuildRepositoryIndex
      parameters: [ { $ref: '#/components/parameters/RepositoryId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RebuildRequest' }
      responses:
        '202': { $ref: '#/components/responses/IndexJobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/RepositoryNotFound' }
        '409': { $ref: '#/components/responses/IndexConflict' }
  /index/repositories/{repoId}/rollback:
    post:
      operationId: rollbackRepositoryIndex
      parameters: [ { $ref: '#/components/parameters/RepositoryId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RollbackRequest' }
      responses:
        '202': { $ref: '#/components/responses/IndexJobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/RepositoryNotFound' }
        '409': { $ref: '#/components/responses/IndexConflict' }
components:
  securitySchemes:
    indexerAdminToken:
      type: apiKey
      in: header
      name: X-Api-Token
      description: Distinct Indexer-admin credential; never use the Semantic read credential.
  parameters:
    RepositoryId:
      name: repoId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    IndexJobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    IndexJobAccepted:
      description: Source revision selected and asynchronous job accepted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IndexJobResponse' }
    IndexJob:
      description: Current asynchronous index-job status.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IndexJobResponse' }
    IndexJobStatus:
      description: Current asynchronous index-job status for bounded deployment polling.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IndexJobStatusResponse' }
    IndexPublication:
      description: Current and bounded rollback pointers from one repository coordinator document.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IndexPublicationResponse' }
    Unauthorized:
      description: Missing or invalid Indexer-admin credential.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Indexer administration is disabled because no admin credential is configured.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RepositoryNotFound:
      description: The repository is not configured.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    IndexJobNotFound:
      description: The requested asynchronous job does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BadRequest:
      description: The administrative request is malformed or violates a command precondition.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    IndexConflict:
      description: An active job, required schema rebuild, or expected pointer prevents the operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    IndexJobResponse:
      type: object
      additionalProperties: false
      required: [jobId, repositoryId, phase]
      properties:
        jobId: { type: string }
        repositoryId: { type: string }
        target: { $ref: '#/components/schemas/IndexJobTarget', nullable: true }
        phase:
          type: string
          enum: [ACCEPTED, RUNNING, COMPLETE, FAILED]
        failureCategory:
          type: string
          nullable: true
          enum: [WORKER_INTERRUPTED, SOURCE_UNAVAILABLE, SCHEMA_REBUILD_REQUIRED, PUBLICATION_CONFLICT, VALIDATION_FAILED]
    PublicationCycle:
      type: object
      additionalProperties: false
      required: [cycleId]
      properties:
        cycleId: { type: integer, format: int64, minimum: 1 }
    IndexJobStatusResponse:
      type: object
      additionalProperties: false
      required: [jobId, repositoryId, operation, phase, active]
      properties:
        jobId: { type: string }
        repositoryId: { type: string }
        target: { $ref: '#/components/schemas/IndexJobTarget', nullable: true }
        operation: { type: string, enum: [BUILD, ROLLBACK, RESET, NO_WORK] }
        phase: { type: string, enum: [ACCEPTED, RUNNING, COMPLETE, FAILED] }
        active: { type: boolean }
        failureCategory:
          type: string
          nullable: true
          enum: [WORKER_INTERRUPTED, SOURCE_UNAVAILABLE, SCHEMA_REBUILD_REQUIRED, PUBLICATION_CONFLICT, VALIDATION_FAILED]
        currentPointer:
          allOf: [{ $ref: '#/components/schemas/GenerationPointer' }]
          nullable: true
    IndexPublicationResponse:
      type: object
      additionalProperties: false
      required: [currentPointer, rollbackPointer]
      properties:
        currentPointer:
          allOf: [{ $ref: '#/components/schemas/GenerationPointer' }]
          nullable: true
        rollbackPointer:
          allOf: [{ $ref: '#/components/schemas/GenerationPointer' }]
          nullable: true
    ApiError:
      type: object
      additionalProperties: false
      required: [errorCode, message, candidates, requestId]
      properties:
        errorCode: { type: string }
        message: { type: string }
        repoId: { type: string, nullable: true }
        expectedRevision: { type: string, nullable: true }
        currentRevision: { type: string, nullable: true }
        target: { type: object, nullable: true }
        candidates: { type: array, items: { type: object } }
        requestId: { type: string }
    SyncRequest:
      type: object
      additionalProperties: false
      properties: { branch: { type: string } }
    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties: { revision: { type: string, pattern: '^[0-9a-f]{40}$' } }
    RebuildRequest:
      type: object
      additionalProperties: false
      required: [authorizeIncompatibleSchema, expectedCurrent]
      properties:
        authorizeIncompatibleSchema: { type: boolean }
        expectedCurrent: { $ref: '#/components/schemas/GenerationPointer' }
    GenerationPointer:
      type: object
      additionalProperties: false
      required: [revision, generationId, manifestDigest, committedJobId, publishedAt]
      properties:
        revision: { type: string, pattern: '^[0-9a-f]{40}$' }
        generationId: { type: string }
        manifestDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        committedJobId: { type: string }
        publishedAt: { type: string, format: date-time }
    IndexJobTarget:
      type: object
      additionalProperties: false
      required: [revision, generationId, generation]
      properties:
        revision: { type: string, pattern: '^[0-9a-f]{40}$' }
        generationId: { type: string }
        generation: { type: integer, format: int64, minimum: 1 }
    RollbackRequest:
      type: object
      additionalProperties: false
      required: [expectedCurrent, expectedRollback]
      properties:
        expectedCurrent: { $ref: '#/components/schemas/GenerationPointer' }
        expectedRollback: { $ref: '#/components/schemas/GenerationPointer' }
