openapi: 3.0.3
info:
  title: Java Semantic Service Repository API
  version: v1
security:
  - ApiToken: []
paths:
  /v1/repositories:
    get:
      operationId: listRepositories
      responses:
        '200':
          description: Configured repository statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/repositories/{repoId}:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    get:
      operationId: getRepository
      responses:
        '200':
          $ref: '#/components/responses/RepositoryStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/repositories/{repoId}/ensure:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    post:
      operationId: ensureRepository
      responses:
        '200':
          $ref: '#/components/responses/RepositoryStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/repositories/{repoId}/sync:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    post:
      operationId: syncRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRepositoryRequest'
      responses:
        '200':
          $ref: '#/components/responses/RepositoryStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/repositories/{repoId}/checkout:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    post:
      operationId: checkoutRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRepositoryRequest'
      responses:
        '200':
          $ref: '#/components/responses/RepositoryStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/repositories/{repoId}/entry-points:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    get:
      operationId: listEntryPoints
      parameters:
        - name: types
          in: query
          required: false
          schema:
            type: string
            pattern: '^(API|MQ|SCHEDULE)(,(API|MQ|SCHEDULE))*$'
      responses:
        '200':
          $ref: '#/components/responses/EntryPoints'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/analyses/call-graphs/outgoing:
    post:
      operationId: analyzeOutgoingCallGraph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeOutgoingCallGraphRequest'
      responses:
        '200':
          $ref: '#/components/responses/OutgoingCallGraph'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/MutationFailed'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/analyses/call-graphs/incoming:
    post:
      operationId: analyzeIncomingCallGraph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeIncomingCallGraphRequest'
      responses:
        '200':
          $ref: '#/components/responses/IncomingCallGraph'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/MutationFailed'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/api-routes/lookup:
    post:
      operationId: lookupApiRoutes
      description: Unknown-but-valid repoScope values return an empty candidate list with 200 and do not manufacture a repository status error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRouteLookupRequest'
      responses:
        '200':
          $ref: '#/components/responses/ApiRouteCandidates'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '500':
          $ref: '#/components/responses/MutationFailed'
  /v1/api-routes/suggest:
    post:
      operationId: suggestApiRoutes
      description: Unknown-but-valid repoScope values return an empty candidate list with 200 and do not manufacture a repository status error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRouteSuggestRequest'
      responses:
        '200':
          $ref: '#/components/responses/ApiRouteCandidates'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthDisabled'
        '500':
          $ref: '#/components/responses/MutationFailed'
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-Api-Token
  parameters:
    RepoId:
      name: repoId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
  responses:
    RepositoryStatus:
      description: Repository status
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RepositoryStatusResponse'
    EntryPoints:
      description: Revision-bound entry-point inventory
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntryPointsResponse'
    OutgoingCallGraph:
      description: Revision-bound outgoing call graph fragment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OutgoingCallGraphResponse'
    IncomingCallGraph:
      description: Revision-bound incoming call graph fragment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IncomingCallGraphResponse'
    ApiRouteCandidates:
      description: Per-candidate route matches, each bound to its analyzed revision
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiRouteCandidatesResponse'
    BadRequest:
      description: Invalid repository id or request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Missing or wrong API token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    AuthDisabled:
      description: API token is not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthDisabledErrorResponse'
    NotFound:
      description: Repository or analysis symbol is not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Repository is busy, immutable, not ready, or revision-mismatched
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    UnprocessableEntity:
      description: Analysis symbol could not be resolved
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    MutationFailed:
      description: Sanitized service failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    BadGateway:
      description: Semantic protocol failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ServiceUnavailable:
      description: Semantic engine is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    GatewayTimeout:
      description: Semantic engine request timed out
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    SyncRepositoryRequest:
      type: object
      properties:
        branch:
          type: string
    CheckoutRepositoryRequest:
      type: object
      required:
        - revision
      properties:
        revision:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    AnalyzeOutgoingCallGraphRequest:
      type: object
      additionalProperties: false
      required:
        - repoId
        - expectedRevision
        - target
      properties:
        repoId:
          type: string
          minLength: 1
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        expectedRevision:
          type: string
          minLength: 1
          pattern: '^[0-9a-f]{40}$|^FIXTURE$'
        depth:
          type: integer
          default: 2
          minimum: 1
          maximum: 2
        target:
          $ref: '#/components/schemas/MethodTarget'
    AnalyzeIncomingCallGraphRequest:
      type: object
      additionalProperties: false
      required:
        - repoId
        - expectedRevision
        - target
      properties:
        repoId:
          type: string
          minLength: 1
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        expectedRevision:
          type: string
          minLength: 1
          pattern: '^[0-9a-f]{40}$|^FIXTURE$'
        depth:
          type: integer
          default: 2
          minimum: 1
          maximum: 2
        target:
          $ref: '#/components/schemas/MethodTarget'
    MethodTarget:
      type: object
      additionalProperties: false
      required:
        - sourceFile
        - packageName
        - className
        - methodName
        - parameterTypes
      properties:
        sourceFile:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: '^[^\u0000-\u001F\u007F-\u009F]*[^\u0000-\u0020\u007F-\u009F\u1680\u2000-\u2006\u2008-\u200A\u2028-\u2029\u205F\u3000][^\u0000-\u001F\u007F-\u009F]*$'
          description: Repository-relative source path. The server additionally enforces normalized path segments.
        packageName:
          type: string
        className:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[\p{L}\p{Nl}\p{Sc}\p{Pc}][\p{L}\p{Nl}\p{Sc}\p{Pc}\p{Mn}\p{Mc}\p{Nd}]*(?:\.[\p{L}\p{Nl}\p{Sc}\p{Pc}][\p{L}\p{Nl}\p{Sc}\p{Pc}\p{Mn}\p{Mc}\p{Nd}]*)*$'
          description: Portable Unicode-category approximation of the server's dot-separated Java identifier validation.
        methodName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[\p{L}\p{Nl}\p{Sc}\p{Pc}][\p{L}\p{Nl}\p{Sc}\p{Pc}\p{Mn}\p{Mc}\p{Nd}]*$'
          description: Portable Unicode-category approximation of the server's Java identifier validation.
        parameterTypes:
          type: array
          minItems: 0
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
    ApiRouteLookupRequest:
      type: object
      required:
        - apiPath
      properties:
        apiPath:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        httpMethod:
          type: string
          nullable: true
        repoScope:
          type: string
          nullable: true
    ApiRouteSuggestRequest:
      type: object
      required:
        - apiPath
        - limit
      properties:
        apiPath:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        httpMethod:
          type: string
          nullable: true
        repoScope:
          type: string
          nullable: true
        limit:
          type: integer
          minimum: 1
          maximum: 20
    OutgoingGraphStatus:
      type: string
      enum:
        - SUCCESS
        - PARTIAL
    GraphContentState:
      type: string
      enum:
        - FULL_SOURCE
        - TARGET_ONLY
        - EXTERNAL
    GraphTraversalState:
      type: string
      enum:
        - EXPANDED
        - DEPTH_BOUNDARY
        - BUDGET_CUTOFF
        - EXTERNAL
    GraphLimitReason:
      type: string
      enum:
        - NONE
        - NODE_BUDGET
    Position:
      type: object
      additionalProperties: false
      description: Zero-based UTF-16 position.
      required:
        - line
        - character
      properties:
        line:
          type: integer
          minimum: 0
        character:
          type: integer
          minimum: 0
    SourceRange:
      type: object
      additionalProperties: false
      description: Zero-based UTF-16 range with a start-inclusive and end-exclusive boundary.
      required:
        - sourceFile
        - start
        - end
      properties:
        sourceFile:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        start:
          $ref: '#/components/schemas/Position'
        end:
          $ref: '#/components/schemas/Position'
    GraphTraversal:
      type: object
      additionalProperties: false
      required:
        - requestedDepth
        - expandedNodeCount
        - nodeBudget
        - rootDirectCallsComplete
        - limitReason
      properties:
        requestedDepth:
          type: integer
          minimum: 1
          maximum: 2
        expandedNodeCount:
          type: integer
          minimum: 0
          description: Number of depth-2 source-expansion nodes included in this fragment.
        nodeBudget:
          type: integer
          minimum: 0
          description: Server limit for depth-2 source-expansion nodes; it never removes a root direct call.
        rootDirectCallsComplete:
          type: boolean
          description: Whether root direct calls for the requested traversal direction are complete.
        limitReason:
          $ref: '#/components/schemas/GraphLimitReason'
    GraphNode:
      type: object
      additionalProperties: false
      required:
        - nodeId
        - contentState
        - traversalState
      properties:
        nodeId:
          type: string
        target:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MethodTarget'
        externalSymbol:
          type: string
          nullable: true
        contentState:
          $ref: '#/components/schemas/GraphContentState'
        traversalState:
          $ref: '#/components/schemas/GraphTraversalState'
        methodBody:
          type: string
          nullable: true
        declarationRange:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SourceRange'
    GraphEdge:
      type: object
      additionalProperties: false
      description: A caller-to-callee edge for one proven call site.
      required:
        - callerNodeId
        - calleeNodeId
        - callSite
        - callExpression
        - resolutionStrategy
        - confidence
        - evidence
      properties:
        callerNodeId:
          type: string
        calleeNodeId:
          type: string
        callSite:
          $ref: '#/components/schemas/SourceRange'
        callExpression:
          type: string
        resolutionStrategy:
          type: string
        confidence:
          type: number
          format: double
        evidence:
          type: array
          items:
            type: string
    GraphWarning:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - nodeId
        - candidates
      properties:
        code:
          type: string
        message:
          type: string
        nodeId:
          type: string
        callExpression:
          type: string
          nullable: true
        callSite:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SourceRange'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MethodTarget'
    GraphError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - nodeId
      properties:
        code:
          type: string
        message:
          type: string
        nodeId:
          type: string
    OutgoingCallGraphResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - analyzedRevision
        - rootNodeId
        - traversal
        - nodes
        - edges
        - warnings
        - errors
      properties:
        status:
          $ref: '#/components/schemas/OutgoingGraphStatus'
        analyzedRevision:
          type: string
          pattern: '^[0-9a-f]{40}$|^FIXTURE$'
        rootNodeId:
          type: string
        traversal:
          $ref: '#/components/schemas/GraphTraversal'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/GraphWarning'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/GraphError'
    IncomingCallGraphResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - analyzedRevision
        - rootNodeId
        - traversal
        - nodes
        - edges
        - warnings
        - errors
      properties:
        status:
          $ref: '#/components/schemas/OutgoingGraphStatus'
        analyzedRevision:
          type: string
          pattern: '^[0-9a-f]{40}$|^FIXTURE$'
        rootNodeId:
          type: string
        traversal:
          $ref: '#/components/schemas/GraphTraversal'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/GraphWarning'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/GraphError'
    ApiRouteCandidateResponse:
      type: object
      required:
        - repoId
        - analyzedRevision
        - httpMethod
        - routeTemplate
        - packageName
        - className
        - methodName
      properties:
        repoId:
          type: string
        analyzedRevision:
          type: string
          pattern: '^[0-9a-f]{40}$|^FIXTURE$'
        httpMethod:
          type: string
        routeTemplate:
          type: string
        packageName:
          type: string
        className:
          type: string
        methodName:
          type: string
    ApiRouteCandidatesResponse:
      type: object
      required:
        - candidates
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ApiRouteCandidateResponse'
    EntryPointsResponse:
      type: object
      required:
        - repoId
        - analyzedRevision
        - entryPoints
      properties:
        repoId:
          type: string
        analyzedRevision:
          type: string
          pattern: '^[0-9a-f]{40}$|^FIXTURE$'
        entryPoints:
          type: array
          items:
            $ref: '#/components/schemas/EntryPointClassResponse'
    EntryPointClassResponse:
      type: object
      required:
        - className
        - packageName
        - packagePath
        - description
        - basePaths
        - methods
      properties:
        className:
          type: string
        packageName:
          type: string
        packagePath:
          type: string
        description:
          type: string
        basePaths:
          type: array
          items:
            type: string
        methods:
          type: array
          items:
            $ref: '#/components/schemas/EntryPointMethodResponse'
    EntryPointMethodResponse:
      oneOf:
        - $ref: '#/components/schemas/ApiEntryPointMethodResponse'
        - $ref: '#/components/schemas/MqEntryPointMethodResponse'
        - $ref: '#/components/schemas/ScheduleEntryPointMethodResponse'
      discriminator:
        propertyName: type
        mapping:
          API: '#/components/schemas/ApiEntryPointMethodResponse'
          MQ: '#/components/schemas/MqEntryPointMethodResponse'
          SCHEDULE: '#/components/schemas/ScheduleEntryPointMethodResponse'
    ApiEntryPointMethodResponse:
      type: object
      required:
        - name
        - description
        - type
        - apiUrl
        - httpMethods
        - swaggerDescriptions
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
            - API
        apiUrl:
          type: string
        httpMethods:
          type: array
          items:
            type: string
        swaggerDescriptions:
          type: array
          items:
            type: string
    MqEntryPointMethodResponse:
      type: object
      required:
        - name
        - description
        - type
        - broker
        - destinations
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
            - MQ
        broker:
          type: string
          enum:
            - RABBIT
            - KAFKA
        destinations:
          type: array
          items:
            type: string
    ScheduleEntryPointMethodResponse:
      type: object
      required:
        - name
        - description
        - type
        - triggerKind
        - triggerValue
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
            - SCHEDULE
        triggerKind:
          type: string
          enum:
            - CRON
            - FIXED_DELAY
            - FIXED_RATE
            - JOB_HANDLER
            - UNSPECIFIED
        triggerValue:
          type: string
    RepositoryStatusResponse:
      type: object
      required:
        - repoId
        - mode
        - displayName
        - cloned
      properties:
        repoId:
          type: string
        mode:
          type: string
          enum:
            - REMOTE
            - LOCAL_FIXTURE
        displayName:
          type: string
        currentBranch:
          type: string
          nullable: true
        currentRevision:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{40}$|^FIXTURE$'
        cloned:
          type: boolean
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required:
        - errorCode
        - message
        - candidates
      properties:
        errorCode:
          type: string
          enum:
            - REQUEST_INVALID
            - SEMANTIC_UNAUTHORIZED
            - REPOSITORY_NOT_FOUND
            - REPOSITORY_NOT_READY
            - REPOSITORY_REVISION_MISMATCH
            - SEMANTIC_BINDING_AMBIGUOUS
            - SEMANTIC_TARGET_NOT_FOUND
            - SEMANTIC_BINDING_UNRESOLVED
            - SEMANTIC_PROTOCOL_ERROR
            - SEMANTIC_ENGINE_START_FAILED
            - SEMANTIC_REQUEST_TIMEOUT
            - INTERNAL_ERROR
        message:
          type: string
        repoId:
          type: string
          nullable: true
        currentRevision:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{40}$|^FIXTURE$'
        expectedRevision:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{40}$|^FIXTURE$'
        target:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MethodTarget'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MethodTarget'
        requestId:
          type: string
          nullable: true
    AuthDisabledErrorResponse:
      type: object
      additionalProperties: false
      required:
        - errorCode
        - message
        - candidates
      properties:
        errorCode:
          type: string
          enum:
            - SEMANTIC_AUTH_DISABLED
        message:
          type: string
        repoId:
          type: string
          nullable: true
        expectedRevision:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{40}$|^FIXTURE$'
        currentRevision:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{40}$|^FIXTURE$'
        target:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MethodTarget'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MethodTarget'
        requestId:
          type: string
          nullable: true
