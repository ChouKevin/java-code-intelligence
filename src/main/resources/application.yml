spring:
  ai:
    mcp:
      server:
        enabled: true
        protocol: STATELESS
        type: SYNC
        stdio: false
        tool-callback-converter: false
        annotation-scanner:
          enabled: false
        streamable-http:
          # STATELESS mode still uses this Spring AI endpoint property
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

semantic:
  syntax:
    cache:
      # weight 為 RepositorySyntax 結構性 metadata 數量，不是原始碼位元組數
      maximum-weight: ${REPOSITORY_SYNTAX_CACHE_MAXIMUM_WEIGHT:10000}
      maximum-entry-weight: ${REPOSITORY_SYNTAX_CACHE_MAXIMUM_ENTRY_WEIGHT:1000}
      expire-after-access: ${REPOSITORY_SYNTAX_CACHE_EXPIRE_AFTER_ACCESS:10m}
  analysis:
    outgoing:
      depth-two-node-budget: ${OUTGOING_DEPTH_TWO_NODE_BUDGET:40}
    incoming:
      depth-two-node-budget: ${INCOMING_DEPTH_TWO_NODE_BUDGET:40}
    read-policy:
      forbidden-repositories: []
      forbidden-packages: []
      forbidden-classes: []
      forbidden-methods: []
  discovery:
    source-symbol-resolution:
      context-candidate-limit: ${SOURCE_SYMBOL_CONTEXT_CANDIDATE_LIMIT:100}
    internal-references:
      cache:
        maximum-weight: ${INTERNAL_REFERENCE_CACHE_MAXIMUM_WEIGHT:10000}
        expire-after-access: ${INTERNAL_REFERENCE_CACHE_EXPIRE_AFTER_ACCESS:10m}
        maximum-entry-weight: ${INTERNAL_REFERENCE_CACHE_MAXIMUM_ENTRY_WEIGHT:1000}
  api:
    api-token: ${SEMANTIC_API_TOKEN:}
  jdtls:
    enabled: ${JDTLS_ENABLED:true}
    home: ${JDTLS_HOME:/opt/jdtls}
    workspace-data-root: ${JDTLS_WORKSPACE_DATA_ROOT:/data/jdtls}
    startup-timeout: ${JDTLS_STARTUP_TIMEOUT:180s}
    import-timeout: ${JDTLS_IMPORT_TIMEOUT:900s}
    request-timeout: ${JDTLS_REQUEST_TIMEOUT:30s}
    max-active-workspaces: ${JDTLS_MAX_ACTIVE_WORKSPACES:2}
    idle-timeout: ${JDTLS_IDLE_TIMEOUT:30m}
    maintenance-interval: ${JDTLS_MAINTENANCE_INTERVAL:1m}
    max-heap: ${JDTLS_MAX_HEAP:2g}
  data-root: /data/repos
  repository-lock-timeout: 5s
  git-username: ${GIT_USERNAME:}
  git-token: ${GIT_TOKEN:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi/semantic-api-v1.yaml
    disable-swagger-default-url: true

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO
