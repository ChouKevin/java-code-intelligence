spring:
  application:
    name: document-query
  ai:
    mcp:
      server:
        # Owned explicitly by DocumentMcpConfiguration; no auto tool discovery/conversion.
        enabled: false
        protocol: STATELESS
        # Explicit SDK async response boundary; document operations/materialization remain synchronous.
        type: ASYNC
        annotation-scanner:
          enabled: false
server:
  port: 8082
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
document:
  api-token: ${DOCUMENT_QUERY_API_TOKEN}
