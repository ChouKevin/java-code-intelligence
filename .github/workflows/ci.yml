name: CI

on:
  pull_request:
  push:
    branches:
      - uat
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: scripts/test-install-jdtls.sh

      - run: scripts/test-smoke-jdtls-image.sh

      - run: mvn --batch-mode --no-transfer-progress clean test

      - name: Test payment-service UAT fixture
        run: mvn --batch-mode --no-transfer-progress -f fixtures/uat/payment-service/pom.xml test

      - name: Test order-service UAT fixture
        run: mvn --batch-mode --no-transfer-progress -f fixtures/uat/order-service/pom.xml test

      - run: docker build -t java-code-intelligence:ci .

      - run: scripts/smoke-jdtls-image.sh java-code-intelligence:ci
