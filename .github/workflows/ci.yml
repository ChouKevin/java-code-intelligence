name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn --batch-mode --no-transfer-progress clean test
      - run: docker build -f Dockerfile.indexer -t java-semantic-indexer:ci .
      - run: docker build -f Dockerfile.query -t java-semantic-query:ci .
      - run: bash scripts/test-query-image.sh java-semantic-query:ci

  tool-projection-evolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/install-jdtls.sh /opt/jdtls
      - run: >-
          mvn --batch-mode --no-transfer-progress -pl semantic-indexer,semantic-query -am -Pmongo-it
          -Dtest=SameRevisionRebuildIT,ToolProjectionEvolutionIT,ToolProjectionCatalogTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - run: JDTLS_HOME=/opt/jdtls scripts/test-indexer-query-contract.sh
