name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    name: Source reactor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: mvn --batch-mode --no-transfer-progress clean test

  fixture-tests:
    name: Deterministic fixture projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: mvn --batch-mode --no-transfer-progress -f semantic-indexer/fixtures/uat/payment-service/pom.xml test
      - run: mvn --batch-mode --no-transfer-progress -f semantic-indexer/fixtures/uat/order-service/pom.xml test
      - run: mvn --batch-mode --no-transfer-progress -f semantic-indexer/fixtures/uat/video-service/pom.xml test

  source-journey:
    name: Real source MCP journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: scripts/test-source-mcp.sh

  source-images:
    name: Source image isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: docker build -f Dockerfile.indexer -t java-source-indexer:phase1 .
      - run: docker build -f Dockerfile.query -t java-source-query:phase1 .
      - run: QUERY_IMAGE=java-source-query:phase1 INDEXER_IMAGE=java-source-indexer:phase1 scripts/test-source-images.sh
